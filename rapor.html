function normalizeKelas(k) {
  if (!k) return '';
  return String(k)
    .trim()
    .toLowerCase()
    .replace(/^jilid\s*/i, '')
    .replace(/^pra\s+bilqolam/i, 'pra')
    .replace(/[^a-z0-9]/g, '');
}

function isKelasMatch(k1, k2) {
  if (!k1 || !k2) return false;
  const s1 = String(k1).trim().toLowerCase();
  const s2 = String(k2).trim().toLowerCase();
  if (s1 === s2) return true;
  return normalizeKelas(k1) === normalizeKelas(k2);
}

function loadMateriForInput() {

  const container = document.getElementById('rn_santriList');
  const infoContainer = document.getElementById('rn_infoMateri');
  
  if (!kelas) {
    container.innerHTML = '';
    infoContainer.style.display = 'none';
    return;
  }

  infoContainer.style.display = 'none';
  if (container) {
    container.innerHTML = `
      <div class="text-center py-5 border rounded bg-light">
        <div class="spinner-border text-primary mb-2" role="status"></div>
        <div class="text-muted fw-semibold">Memuat materi &amp; daftar nilai santri kelas <strong>${kelas}</strong>...</div>
      </div>
    `;
  }
  showLoading('Memuat data nilai kelas ' + kelas + '...');
  
  // Load materi untuk kelas ini
  google.script.run
    .withSuccessHandler(function(materiList) {
      infoContainer.style.display = 'block';
      if (!materiList || materiList.length === 0) {
        infoContainer.innerHTML = `
          <div class="text-warning">
            <i class="fas fa-exclamation-triangle"></i> <strong>Belum ada materi untuk kelas ${kelas}.</strong> Silakan atur materi di sub menu <em>Pengaturan Materi</em>.
          </div>
        `;
      } else {
        infoContainer.innerHTML = `
          <strong>Materi Kelas ${kelas}:</strong><br>
          ${materiList.map(m => `• ${m.materi} (Bobot: ${m.bobot}${m.tipe === 'plus' ? ' - Nilai Plus' : ''})`).join('<br>')}
        `;
      }
      
      // Load santri di kelas ini (fuzzy match kelas dan status aktif)
      google.script.run
        .withSuccessHandler(function(santriList) {
          const filtered = (santriList || []).filter(s => {
            const sK = s.Kelas || s.kelas || '';
            const matchK = isKelasMatch(sK, kelas);
            const status = String(s.Status || s.status || 'aktif').trim().toLowerCase();
            return matchK && (status === 'aktif' || status === '');
          });
          
          if (filtered.length === 0) {
            hideLoading();
            container.innerHTML = '<div class="alert alert-warning">Tidak ada santri di kelas ini (Kelas: ' + kelas + ')</div>';
            return;
          }
          
          // Sort santri by name
          filtered.sort((a, b) => {
            const nameA = String(a.Nama_Santri || a.nama_santri || a.Nama || a.nama || '');
            const nameB = String(b.Nama_Santri || b.nama_santri || b.Nama || b.nama || '');
            return nameA.localeCompare(nameB);
          });
          
          // Load nilai yang sudah ada
          const ta = document.getElementById('rn_ta').value;
          google.script.run
            .withSuccessHandler(function(nilaiList) {
              hideLoading();
              renderInputNilaiForm(filtered, materiList || [], nilaiList || [], kelas);
            })
            .withFailureHandler(function(e) {
              hideLoading();
              renderInputNilaiForm(filtered, materiList || [], [], kelas);
            })
            .getNilaiRaporByKelas(kelas, ta);
        })
        .withFailureHandler(function(e) {
          hideLoading();
          container.innerHTML = '<div class="alert alert-danger">Gagal memuat data santri: ' + e.message + '</div>';
        })
        .getSantriList();
    })
    .withFailureHandler(function(e) {
      hideLoading();
      infoContainer.style.display = 'block';
      infoContainer.innerHTML = '<div class="alert alert-danger">Gagal memuat materi: ' + e.message + '</div>';
      if (container) container.innerHTML = '';
    })
    .getMateriByKelas(kelas);
}

function hitungNilaiAkhir(el) {
  const row = el.closest('tr');
  const inputs = row.querySelectorAll('.nilai-kesalahan, .nilai-lagu');
  
  let totalKurangan = 0;
  let nilaiLagu = 0;
  
  inputs.forEach(input => {
    const bobot = parseFloat(input.dataset.bobot) || 0;
    const tipe = input.dataset.tipe;
    const value = parseFloat(input.value) || 0;
    
    if (tipe === 'plus') {
      nilaiLagu = value;
    } else {
      totalKurangan += bobot * value;
    }
  });
  
  let nilaiAkhir = 95 - totalKurangan + nilaiLagu;
  if (nilaiAkhir < 70) nilaiAkhir = 70;
  
  row.querySelector('.total-kurangan').innerHTML = `<strong>${totalKurangan}</strong>`;
  row.querySelector('.nilai-akhir').innerHTML = `<strong class="text-primary">${Math.round(nilaiAkhir)}</strong>`;
}

function hitungRataRataDiniyah(el) {
  const row = el.closest('tr');
  const inputs = row.querySelectorAll('.nilai-manual');
  let total = 0, count = 0;
  
  inputs.forEach(input => {
    const v = parseFloat(input.value);
    if (!isNaN(v)) {
      total += v;
      count++;
    }
  });
  
  const rata = count > 0 ? Math.round(total / count) : 0;
  row.querySelector('.rata-rata').innerHTML = `<strong>${rata}</strong>`;
}

function hitungTotalWeighted(el) {
  const row = el.closest('tr');
  const inputs = row.querySelectorAll('.nilai-weighted');
  let total = 0;
  
  inputs.forEach(input => {
    total += parseFloat(input.value) || 0;
  });
  
  row.querySelector('.total-weighted').innerHTML = `<strong class="text-primary">${total}</strong>`;
}

function simpanSemuaNilai() {
  const ta = document.getElementById('rn_ta').value.trim();
  const kelas = document.getElementById('rn_kelas').value;
  const semester = '-';
  
  if (!kelas) {
    showToast('Pilih kelas terlebih dahulu', 'warning');
    return;
  }
  
  const rows = document.querySelectorAll('#rn_santriList tbody tr');
  if (rows.length === 0) {
    showToast('Tidak ada data santri', 'warning');
    return;
  }
  
  const batchData = [];
  rows.forEach(row => {
    const nis = row.dataset.nis;
    const nama = row.dataset.nama;
    
    // Collect sikap santri and catatan from this row
    const perilaku = row.querySelector('.sikap-perilaku')?.value || 'B';
    const kedisiplinan = row.querySelector('.sikap-disiplin')?.value || 'B';
    const keaktifan = row.querySelector('.sikap-aktif')?.value || 'B';
    const catatanPenguji = row.querySelector('.catatan-penguji')?.value || '';
    
    const inputs = row.querySelectorAll('input[data-materi], select[data-materi]');
    inputs.forEach(input => {
      const materi = input.dataset.materi;
      if (!materi) return;
      const idMateri = input.dataset.id || '';
      const bobot = parseFloat(input.dataset.bobot) || 0;
      const tipe = input.dataset.tipe || 'regular';
      let nilaiMateri = 0;
      let jumlahKesalahan = 0;
      
      if (input.classList.contains('nilai-kesalahan')) {
        jumlahKesalahan = parseFloat(input.value) || 0;
        nilaiMateri = 0;
      } else if (input.classList.contains('nilai-lagu')) {
        nilaiMateri = parseFloat(input.value) || 0;
      } else if (input.classList.contains('nilai-manual')) {
        nilaiMateri = parseFloat(input.value) || 0;
      } else if (input.classList.contains('nilai-weighted')) {
        nilaiMateri = parseFloat(input.value) || 0;
      }
      
      batchData.push({
        tahun_ajaran: ta,
        semester: semester,
        nis: nis,
        nama_santri: nama,
        kelas: kelas,
        id_materi: idMateri,
        materi: materi,
        bobot: bobot,
        jumlah_kesalahan: jumlahKesalahan,
        nilai_materi: nilaiMateri,
        tipe: tipe,
        perilaku: perilaku,
        kedisiplinan: kedisiplinan,
        keaktifan: keaktifan,
        catatan_penguji: catatanPenguji,
        input_oleh: (typeof currentUser !== 'undefined' && currentUser ? (currentUser.nama || currentUser.username) : 'Ustadz')
      });
    });
  });
  
  if (batchData.length === 0) {
    showToast('Tidak ada data nilai yang ditemukan', 'warning');
    return;
  }
  
  showLoading('Menyimpan ' + batchData.length + ' nilai rapor...');
  google.script.run
    .withSuccessHandler(function(res) {
      hideLoading();
      if (res && res.success) {
        showToast(res.message || 'Semua nilai berhasil disimpan! 🎉', 'success');
      } else {
        showToast('Info: ' + (res ? res.message : 'Nilai disimpan'), 'info');
      }
    })
    .withFailureHandler(function(e) {
      hideLoading();
      showToast('Error simpan nilai: ' + e.message, 'error');
    })
    .saveBatchNilaiRapor(batchData);
}

    const kObj = window._raporKelasListCache.find(k => isKelasMatch(k.Nama_Kelas || k['Nama Kelas'], kelas));
    if (kObj && kObj.Ustadz_Wali) {
      crWali.value = kObj.Ustadz_Wali;
    }
  }

  if (kelas) {
    prosesCetakRapor();
  } else {
    const resEl = document.getElementById('cr_result');
    if (resEl) {
      resEl.innerHTML = `
        <div class="text-center py-5 text-muted border rounded bg-light">
          <i class="fas fa-file-invoice fa-3x mb-3 text-secondary opacity-50"></i>
          <h6>Silakan pilih kelas terlebih dahulu untuk menampilkan dan mencetak Rapor F4.</h6>
        </div>
      `;
    }
  }
}

function prosesCetakRapor() {
  const kelas = document.getElementById('cr_kelas') ? document.getElementById('cr_kelas').value : '';
  const ta = document.getElementById('cr_ta') ? document.getElementById('cr_ta').value.trim() : '';
  const resContainer = document.getElementById('cr_result');

  if (!kelas || !ta) {
    showToast('Pilih Kelas dan isi Tahun Ajaran terlebih dahulu', 'warning');
    return;
  }

  if (resContainer) {
    resContainer.innerHTML = `
      <div class="text-center py-5 border rounded bg-white shadow-sm">
        <i class="fas fa-spinner fa-spin fa-2x text-primary mb-2"></i>
        <div class="fw-semibold text-muted">Memuat data Nilai Ujian, Nilai Harian (Bupres), Kehadiran (SIA), dan Sikap kelas ${kelas}...</div>
      </div>
    `;
  }

  showLoading('Menyiapkan Rapor F4 kelas ' + kelas + '...');

  google.script.run
    .withSuccessHandler(function(payload) {
      hideLoading();
      if (!payload || !payload.success) {
        if (resContainer) {
          resContainer.innerHTML = `<div class="alert alert-danger">Gagal memuat data rapor: ${(payload && payload.message) || 'Tidak ada respon server'}</div>`;
        }
        return;
      }

      const santriList = payload.santriList || [];
      const filteredSantri = santriList.filter(s => {
        const sK = s.Kelas || s.kelas || '';
        const matchK = isKelasMatch(sK, kelas);
        const status = String(s.Status || s.status || 'aktif').trim().toLowerCase();
        return matchK && (status === 'aktif' || status === '');
      }).sort((a, b) => {
        const nameA = String(a.Nama_Santri || a.nama_santri || a.Nama || a.nama || '').trim();
        const nameB = String(b.Nama_Santri || b.nama_santri || b.Nama || b.nama || '').trim();
        return nameA.localeCompare(nameB);
      });

      // Auto-set Wali Kelas & Kepala TPQ jika ada di payload
      if (payload.kelasList) {
        window._raporKelasListCache = payload.kelasList;
        const kObj = payload.kelasList.find(k => isKelasMatch(k.Nama_Kelas || k['Nama Kelas'], kelas));
        const crWali = document.getElementById('cr_wali');
        if (kObj && kObj.Ustadz_Wali && crWali && !crWali.value.trim()) {
          crWali.value = kObj.Ustadz_Wali;
        }
      }
      if (payload.config) {
        const crKepala = document.getElementById('cr_kepala');
        if (crKepala && !crKepala.value.trim() && (payload.config.kepala_tpq || payload.config.KEPALA_TPQ)) {
          crKepala.value = payload.config.kepala_tpq || payload.config.KEPALA_TPQ;
        }
      }

      _cetakRaporCache = {
        kelas: kelas,
        ta: ta,
        santriList: filteredSantri,
        materiList: (payload.materiList || []).slice().sort((a, b) => (Number(a.urutan) || 0) - (Number(b.urutan) || 0)),
        nilaiList: payload.nilaiList || [],
        bupresList: payload.bupresList || [],
        tmConfig: payload.tmConfig || { tatap_muka: 24 },
        absenList: payload.absenList || []
      };

      // Populate dropdown pilih santri (#cr_santri)
      const santriSelect = document.getElementById('cr_santri');
      if (santriSelect) {
        const prevVal = santriSelect.value;
        let opts = `<option value="ALL">-- Semua Santri Kelas ${kelas} (${filteredSantri.length} Santri) --</option>`;
        filteredSantri.forEach((s, idx) => {
          const nis = String(s.NIS || s.nis || s.Nis || '').trim();
          const nama = s.Nama_Santri || s.nama_santri || s.Nama || s.nama || '-';
          opts += `<option value="${nis}">${idx + 1}. ${nama} (NIS: ${nis})</option>`;
        });
        santriSelect.innerHTML = opts;
        if (prevVal && prevVal !== 'ALL' && filteredSantri.some(s => String(s.NIS || s.nis || s.Nis || '').trim() === prevVal)) {
          santriSelect.value = prevVal;
        } else {
          santriSelect.value = 'ALL';
        }
      }

      renderRaporPreviewFromCache();
    })
    .withFailureHandler(function(err) {
      hideLoading();
      if (resContainer) {
        resContainer.innerHTML = `<div class="alert alert-danger">Gagal memuat data rapor: ${err.message || err}</div>`;
      }
    })
    .getDataCetakRapor(kelas, ta);
}

function hitungDataRaporSantri(santri, cache) {
  const nis = String(santri.NIS || santri.nis || santri.Nis || '').trim();
  const nama = String(santri.Nama_Santri || santri.nama_santri || santri.Nama || santri.nama || '-').trim();
  const santriKelas = String(santri.Kelas || santri.kelas || '').trim();
  const kelas = cache.kelas || santriKelas || '-';
  const ta = cache.ta || '20262';
  let materiList = cache.materiList || [];
  if ((!materiList || materiList.length === 0) && cache.materiByKelasMap && santriKelas) {
    materiList = cache.materiByKelasMap[santriKelas] || [];
    if (materiList.length === 0) {
      const foundKey = Object.keys(cache.materiByKelasMap).find(k => isKelasMatch(k, santriKelas));
      if (foundKey) materiList = cache.materiByKelasMap[foundKey] || [];
    }
  }

  // 1. Nilai Ujian & Sikap
  const nilaiSantri = (cache.nilaiList || []).filter(n => {
    const nNis = String(n.nis || '').trim();
    const nNama = String(n.nama_santri || '').trim().toLowerCase();
    const matchStudent = (nis && nNis === nis) || (!nNis && nNama === nama.toLowerCase());
    const matchTA = !n.tahun_ajaran || String(n.tahun_ajaran).trim() === String(ta).trim();
    return matchStudent && matchTA;
  });

  const upperKelas = String(kelas || '').trim().toUpperCase();
  const isManual = materiList.some(m => m.tipe === 'manual') || upperKelas.includes('DINIYAH');
  const isWeighted = !isManual && (materiList.some(m => m.tipe === 'weighted') || (upperKelas.includes('TAHFIDH') && !upperKelas.includes('TAKHOSSUS')));

  const regularMateri = materiList.filter(m => m.tipe !== 'plus');
  const plusMateriObj = materiList.find(m => m.tipe === 'plus');

  let totalKurangan = 0;
  let nilaiLagu = 0;
  let weightedSum = 0;
  let manualSum = 0;
  let manualCount = 0;

  const detailMateriRows = regularMateri.map((m, idx) => {
    const mNameLower = String(m.materi || '').trim().toLowerCase();
    const rec = nilaiSantri.find(x => String(x.materi || '').trim().toLowerCase() === mNameLower);
    const bobot = Number(m.bobot) || 0;
    const kesalahan = rec ? (Number(rec.jumlah_kesalahan) || 0) : 0;
    const nilaiMat = rec ? (Number(rec.nilai_materi) || 0) : 0;

    let jumlah = 0;
    if (isManual) {
      jumlah = nilaiMat;
      if (rec && rec.nilai_materi !== '' && rec.nilai_materi !== undefined) {
        manualSum += nilaiMat;
        manualCount++;
      }
    } else if (isWeighted) {
      jumlah = nilaiMat;
      weightedSum += nilaiMat;
    } else {
      jumlah = bobot * kesalahan;
      totalKurangan += jumlah;
    }

    return {
      no: idx + 1,
      materi: m.materi || '-',
      bobot: bobot,
      kesalahan: kesalahan,
      nilai_materi: nilaiMat,
      jumlah: jumlah,
      tipe: m.tipe || 'regular'
    };
  });

  // Cari nilai lagu / plus
  const recPlus = nilaiSantri.find(x => x.tipe === 'plus' || String(x.materi || '').trim().toUpperCase().includes('LAGU'));
  if (recPlus && recPlus.nilai_materi !== undefined && recPlus.nilai_materi !== '') {
    nilaiLagu = Number(recPlus.nilai_materi) || 0;
  }

  let totalNilaiUjian = 0;
  if (isManual) {
    totalNilaiUjian = manualCount > 0 ? Math.round(manualSum / manualCount) : (regularMateri.length > 0 ? Math.round(manualSum / regularMateri.length) : 0);
  } else if (isWeighted) {
    totalNilaiUjian = Math.round(weightedSum);
  } else {
    if (nilaiSantri.length > 0) {
      totalNilaiUjian = 95 - totalKurangan + nilaiLagu;
      if (totalNilaiUjian < 70) totalNilaiUjian = 70;
    } else {
      totalNilaiUjian = 0;
    }
  }

  // Sikap & Catatan Penguji dari Nilai_Rapor (menu Input Nilai)
  const firstNilai = nilaiSantri.find(x => x.perilaku || x.kedisiplinan || x.keaktifan || x.catatan_penguji) || nilaiSantri[0] || {};
  const rowWithCatatan = nilaiSantri.find(x => x.catatan_penguji && String(x.catatan_penguji).trim() !== '');
  const perilaku = String(firstNilai.perilaku || 'B').trim().toUpperCase();
  const kedisiplinan = String(firstNilai.kedisiplinan || 'B').trim().toUpperCase();
  const keaktifan = String(firstNilai.keaktifan || 'B').trim().toUpperCase();
  const catatanPenguji = String((rowWithCatatan ? rowWithCatatan.catatan_penguji : firstNilai.catatan_penguji) || '').trim();

  // 2. Nilai Harian (Bupres)
  const bupresRec = (cache.bupresList || []).find(b => {
    const bNis = String(b.nis || '').trim();
    const bNama = String(b.nama_santri || '').trim().toLowerCase();
    return (nis && bNis === nis) || (!bNis && bNama === nama.toLowerCase());
  }) || {};

  const bCount = Number(bupresRec.b) || 0;
  const bMinusCount = Number(bupresRec.b_minus) || 0;
  const cPlusCount = Number(bupresRec.c_plus) || 0;
  const cCount = Number(bupresRec.c) || 0;
  const cMinusCount = Number(bupresRec.c_minus) || 0;
  const kCount = Number(bupresRec.k) || 0;
  const totalPertemuanBupres = bCount + bMinusCount + cPlusCount + cCount + cMinusCount + kCount;
  const targetTatapMuka = Number(bupresRec.tatap_muka) || Number(cache.tmConfig?.tatap_muka) || 24;
  const totalPoinBupres = (bCount * 95) + (bMinusCount * 90) + (cPlusCount * 83) + (cCount * 80) + (cMinusCount * 73) + (kCount * 70);

  let nilaiHarian = 0;
  if (totalPoinBupres > 0 && targetTatapMuka > 0) {
    nilaiHarian = Number((totalPoinBupres / targetTatapMuka).toFixed(2));
  } else if (Number(bupresRec.poin_bck) > 0) {
    nilaiHarian = Number(Number(bupresRec.poin_bck).toFixed(2));
  }
  const catatanBupres = String(bupresRec.catatan || '').trim();

  // 3. Keaktifan / Kehadiran Santri (Total SIA)
  const absenSantri = (cache.absenList || []).filter(a => {
    const aNis = String(a.nis || '').trim();
    const aNama = String(a.nama_santri || '').trim().toLowerCase();
    return (nis && aNis === nis) || (nama && aNama === nama.toLowerCase());
  });

  let totalSakit = 0, totalIzin = 0, totalAlpha = 0, totalHadir = 0;
  absenSantri.forEach(a => {
    const st = String(a.status || 'H').trim().toUpperCase();
    if (st === 'S' || st.includes('SAKIT')) totalSakit++;
    else if (st === 'I' || st.includes('IZIN')) totalIzin++;
    else if (st === 'A' || st.includes('ALPA') || st.includes('ALFA')) totalAlpha++;
    else totalHadir++;
  });
  const totalSIA = totalSakit + totalIzin + totalAlpha;

  // 4. Catatan Penguji (diambil dari Catatan Penguji yang diinput di menu Input Nilai)
  const catatanFinal = catatanPenguji;

  // 5. Rumus Kenaikan Kelas: ((Total Nilai Ujian * 2) + Nilai Harian) / 3
  const kkm = 80;
  const hasilAkhirRaw = ((totalNilaiUjian * 2) + nilaiHarian) / 3;
  const hasilAkhir = Number(hasilAkhirRaw.toFixed(2));

  let isNaikKelas = hasilAkhir >= kkm;
  if (_overrideNaikMap[nis] !== undefined) {
    isNaikKelas = _overrideNaikMap[nis];
  }

  return {
    nis,
    nama,
    kelas,
    ta,
    kkm,
    isManual,
    isWeighted,
    hasPlusMateri: !!plusMateriObj || !isManual && !isWeighted,
    detailMateriRows,
    totalKurangan,
    nilaiLagu,
    totalNilaiUjian,
    bupres: {
      b: bCount,
      b_minus: bMinusCount,
      c_plus: cPlusCount,
      c: cCount,
      c_minus: cMinusCount,
      k: kCount,
      totalPertemuan: totalPertemuanBupres,
      tatapMuka: targetTatapMuka,
      totalPoin: totalPoinBupres,
      nilaiHarian: nilaiHarian
    },
    sia: {
      sakit: totalSakit,
      izin: totalIzin,
      alpha: totalAlpha,
      hadir: totalHadir,
      totalSIA: totalSIA
    },
    sikap: {
      perilaku,
      kedisiplinan,
      keaktifan
    },
    catatan: catatanFinal,
    hasilAkhir,
    isNaikKelas
  };
}

function toggleOverrideNaikKelas(nis) {
  if (!_cetakRaporCache) return;
  const santri = (_cetakRaporCache.santriList || []).find(s => String(s.NIS || s.nis || s.Nis || '').trim() === String(nis).trim());
  if (!santri) return;
  const currentData = hitungDataRaporSantri(santri, _cetakRaporCache);
  _overrideNaikMap[nis] = !currentData.isNaikKelas;
  renderRaporPreviewFromCache();
}

function renderRaporPreviewFromCache() {
  const resContainer = document.getElementById('cr_result');
  if (!resContainer || !_cetakRaporCache) return;

  const allSantri = _cetakRaporCache.santriList || [];
  if (allSantri.length === 0) {
    resContainer.innerHTML = `<div class="alert alert-warning">Tidak ada santri aktif di kelas <strong>${_cetakRaporCache.kelas}</strong>.</div>`;
    return;
  }

  const selectedNis = document.getElementById('cr_santri') ? document.getElementById('cr_santri').value : 'ALL';
  const modeView = document.getElementById('cr_mode_view') ? document.getElementById('cr_mode_view').value : 'rapor_f4';
  const waliKelas = document.getElementById('cr_wali') ? document.getElementById('cr_wali').value.trim() : '';
  const kepalaTpq = document.getElementById('cr_kepala') ? document.getElementById('cr_kepala').value.trim() : 'M. RAGIL WAHYUDI, M.Pd.';
  const tanggal = document.getElementById('cr_tanggal') ? document.getElementById('cr_tanggal').value.trim() : '';

  const meta = { waliKelas, kepalaTpq, tanggal };

  const santriToRender = (selectedNis && selectedNis !== 'ALL')
    ? allSantri.filter(s => String(s.NIS || s.nis || s.Nis || '').trim() === String(selectedNis).trim())
    : allSantri;

  if (modeView === 'rekap_kelas') {
    resContainer.innerHTML = renderRekapKelasTable(santriToRender, _cetakRaporCache, meta);
    return;
  }

  let sheetsHtml = `<style>${getRaporF4InlineStyles()}</style>`;
  sheetsHtml += `
    <div class="alert alert-success d-flex flex-wrap justify-content-between align-items-center py-2 px-3 mb-3 no-print shadow-sm">
      <div class="small">
        <i class="fas fa-check-circle me-1"></i> Menampilkan <strong>${santriToRender.length} Lembar Rapor F4</strong> (Kelas <strong>${_cetakRaporCache.kelas}</strong> | KKM: <strong>80</strong> | Rumus: <code>(Nilai Ujian &times; 2 + Nilai Harian) &divide; 3</code>)
      </div>
      <button type="button" class="btn btn-sm btn-success fw-bold shadow-sm" onclick="cetakRaporF4()">
        <i class="fas fa-print me-1"></i> Cetak ${santriToRender.length} Rapor Sekarang (Ukuran F4)
      </button>
    </div>
    <div id="cr_f4_sheets_wrapper">
  `;

  santriToRender.forEach((s, idx) => {
    const isLast = (idx === santriToRender.length - 1);
    sheetsHtml += buildSingleRaporF4Html(s, _cetakRaporCache, meta, isLast);

  resContainer.innerHTML = sheetsHtml;
}

function cetakRaporF4(singleNis) {
  if (!_cetakRaporCache || !_cetakRaporCache.santriList || _cetakRaporCache.santriList.length === 0) {
    showToast('Silakan pilih kelas dan tampilkan rapor terlebih dahulu', 'warning');
    return;
  }

  const allSantri = _cetakRaporCache.santriList;
  const selectedNis = singleNis || (document.getElementById('cr_santri') ? document.getElementById('cr_santri').value : 'ALL');
  const waliKelas = document.getElementById('cr_wali') ? document.getElementById('cr_wali').value.trim() : '';
  const kepalaTpq = document.getElementById('cr_kepala') ? document.getElementById('cr_kepala').value.trim() : 'M. RAGIL WAHYUDI, M.Pd.';
  const tanggal = document.getElementById('cr_tanggal') ? document.getElementById('cr_tanggal').value.trim() : '';

  const meta = { waliKelas, kepalaTpq, tanggal };

  const santriToPrint = (selectedNis && selectedNis !== 'ALL')
    ? allSantri.filter(s => String(s.NIS || s.nis || s.Nis || '').trim() === String(selectedNis).trim())
    : allSantri;

  if (santriToPrint.length === 0) {
    showToast('Tidak ada data santri untuk dicetak', 'warning');
    return;
  }

  let bodySheetsHtml = '';
  santriToPrint.forEach((s, idx) => {
    const isLast = (idx === santriToPrint.length - 1);
    bodySheetsHtml += buildSingleRaporF4Html(s, _cetakRaporCache, meta, isLast);
  });

  const fullPrintHtml = `
    <!DOCTYPE html>
    <html lang="id">
    <head>
      <meta charset="UTF-8">
      <title>Cetak Rapor F4 - ${_cetakRaporCache.kelas} - TPQ Al Mabrur</title>
      <style>
        @page {
          size: 215mm 330mm portrait;
          margin: 8mm 12mm;
        }
        * {
          box-sizing: border-box;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
        body {
          margin: 0;
          padding: 0;
          background: #fff;
          color: #000;
          font-family: Arial, Helvetica, sans-serif;
        }
        .no-print {
          display: none !important;
        }
        ${getRaporF4InlineStyles()}
        .rapor-f4-sheet {
          width: 100% !important;
          min-height: 0 !important;
          margin: 0 !important;
          padding: 0 !important;
          border: none !important;
          box-shadow: none !important;
        }
      </style>
    </head>
    <body>
      ${bodySheetsHtml}
    </body>
    </html>
  `;

  let printFrame = document.getElementById('printRaporF4Frame');
  if (printFrame) printFrame.remove();

  printFrame = document.createElement('iframe');
  printFrame.id = 'printRaporF4Frame';
  printFrame.style.position = 'fixed';
  printFrame.style.right = '0';
  printFrame.style.bottom = '0';
  printFrame.style.width = '0';
  printFrame.style.height = '0';
  printFrame.style.border = '0';
  document.body.appendChild(printFrame);

  const frameDoc = printFrame.contentWindow || printFrame.contentDocument.document || printFrame.contentDocument;
  frameDoc.document.open();
  frameDoc.document.write(fullPrintHtml);
  frameDoc.document.close();

  // Tunggu gambar kop surat termuat sebelum membuka dialog print
  let printed = false;
  const triggerPrint = () => {
    if (printed) return;
    printed = true;
    printFrame.contentWindow.focus();
    printFrame.contentWindow.print();
  };

  const imgs = frameDoc.document.querySelectorAll('img');
  if (imgs.length > 0) {
    let loadedCount = 0;
    const checkAllLoaded = () => {
      loadedCount++;
      if (loadedCount >= imgs.length) {
        setTimeout(triggerPrint, 200);
      }
    };
    imgs.forEach(img => {
      if (img.complete) {
        checkAllLoaded();
      } else {
        img.addEventListener('load', checkAllLoaded);
        img.addEventListener('error', checkAllLoaded);
      }
    });
    setTimeout(triggerPrint, 1500);
  } else {
    setTimeout(triggerPrint, 400);
  }
}

let _pmCurrentMateriList = [];
let _examSantriCache = null;
let _examKelasCache = null;
let _examAllMateriCache = null;

function loadPengaturanMateri() {
  const kelas = document.getElementById('pm_kelas').value;
  const container = document.getElementById('pm_materiContainer');
  const tbody = document.getElementById('pm_materiTable');
  const labelAktif = document.getElementById('pm_labelKelasAktif');
  
  if (!kelas) {
    container.style.display = 'none';
    if (labelAktif) labelAktif.textContent = '';
    return;
  }
  
  if (labelAktif) labelAktif.textContent = kelas;
  container.style.display = 'block';
  document.getElementById('formTambahMateri').style.display = 'none';
  
  showLoading('Memuat materi...');
  google.script.run
    .withSuccessHandler(function(materiList) {
      hideLoading();
      _pmCurrentMateriList = materiList || [];
      if (!materiList || materiList.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">Belum ada materi untuk kelas ini. Klik tombol "+ Tambah Materi" di atas untuk menambahkan.</td></tr>';
        return;
      }
      
      tbody.innerHTML = materiList.map((m, i) => `
        <tr>
          <td>${i+1}</td>
          <td>${m.materi}</td>
          <td>${m.bobot}</td>
          <td><span class="badge bg-secondary">${m.tipe}</span></td>
          <td>
            <button class="btn btn-sm btn-warning me-1" onclick="editMateri('${m.id_materi}', '${(m.materi || '').replace(/'/g, "\\'")}', ${m.bobot}, '${m.tipe}', ${m.urutan || 99})" title="Edit"><i class="fas fa-edit"></i></button>
            <button class="btn btn-sm btn-danger" onclick="hapusMateri('${m.id_materi}')" title="Hapus"><i class="fas fa-trash"></i></button>
          </td>
        </tr>
      `).join('');
    })
    .withFailureHandler(function(e) {
      hideLoading();
      tbody.innerHTML = '<tr><td colspan="5" class="text-center text-danger">Gagal memuat materi: ' + e.message + '</td></tr>';
    })
    .getMateriByKelas(kelas);
}

function editMateri(id, nama, bobot, tipe, urutan) {
  document.getElementById('formTambahMateri').style.display = 'block';
  document.getElementById('pm_id_materi').value = id || '';
  document.getElementById('pm_nama').value = nama || '';
  document.getElementById('pm_bobot').value = bobot || 0;
  document.getElementById('pm_tipe').value = tipe || 'regular';
  document.getElementById('pm_urutan').value = urutan || 99;
  document.getElementById('pm_nama').focus();
}

function showFormTambahMateri() {
  document.getElementById('formTambahMateri').style.display = 'block';
  document.getElementById('formMateri').reset();
  document.getElementById('pm_id_materi').value = '';
}

function simpanMateri() {
  const data = {
    id_materi: document.getElementById('pm_id_materi').value,
    kelas: document.getElementById('pm_kelas').value,
    materi: document.getElementById('pm_nama').value,
    bobot: document.getElementById('pm_bobot').value,
    tipe: document.getElementById('pm_tipe').value,
    urutan: document.getElementById('pm_urutan').value
  };
  
  if (!data.kelas) {
    showToast('Silakan pilih kelas terlebih dahulu!', 'warning');
    return;
  }
  
  showLoading('Menyimpan materi...');
  google.script.run
    .withSuccessHandler(function(res) {
      hideLoading();
      showToast(res.message, res.success ? 'success' : 'error');
      if (res.success) {
        _examAllMateriCache = null;
        document.getElementById('formTambahMateri').style.display = 'none';
        loadPengaturanMateri();
      }
    })

function matchMateriKelasClient(materiKelasName, targetKelasName) {
  if (!materiKelasName || !targetKelasName) return false;
  const m = String(materiKelasName).trim().toUpperCase();
  const t = String(targetKelasName).trim().toUpperCase();
  if (m === t) return true;

  const cleanM = m.replace(/^JILID\s*/i, '').replace(/[^A-Z0-9]/g, '');
  const cleanT = t.replace(/^JILID\s*/i, '').replace(/[^A-Z0-9]/g, '');
  if (cleanM === cleanT) return true;

  const tBase = cleanT.replace(/[A-Z]$/, '');
  const mBase = cleanM.replace(/[A-Z]$/, '');
  if (tBase && (tBase === cleanM || tBase === mBase)) return true;

  if (cleanT.includes('PRA') && cleanM.includes('PRA')) return true;
  if (cleanT.includes('DINIYAH') && cleanM.includes('DINIYAH')) return true;

  const isTargetTahfidhJuzAmma = cleanT === 'TAHFIDHJUZAMMA' || (cleanT.includes('TAHFIDH') && !cleanT.includes('TAKHOSSUS'));
  const isMateriTahfidhJuzAmma = cleanM === 'TAHFIDHJUZAMMA' || (cleanM.includes('TAHFIDH') && !cleanM.includes('TAKHOSSUS'));
  if (isTargetTahfidhJuzAmma || isMateriTahfidhJuzAmma) {
    return isTargetTahfidhJuzAmma && isMateriTahfidhJuzAmma;
  }

  if ((cleanT.includes('JUZAMMA') || cleanT.includes('TADARUS') || cleanT.includes('TAKHOSSUS') || cleanT.includes('WISUDA')) &&
      (cleanM.includes('JUZAMMA') || cleanM.includes('TADARUS') || cleanM.includes('TAKHOSSUS') || cleanM.includes('WISUDA'))) {
    return true;
  }

  return false;
}

function resolveMateriForKelasClient(namaKelas, allMateri) {
  if (!namaKelas || !allMateri) return [];
  const target = String(namaKelas).trim();

  let list = allMateri.filter(m => String(m.kelas || '').trim().toUpperCase() === target.toUpperCase());
  if (list.length === 0) {
    list = allMateri.filter(m => matchMateriKelasClient(m.kelas, target));
  }

  return list.slice().sort((a, b) => (Number(a.urutan) || 0) - (Number(b.urutan) || 0));
}

function getValidStudentClassesList(santriList, kelasList) {
  const nonSantri = new Set(['RAPAT', 'ISTIGHOSAH', 'LAIN-LAIN']);
  const classSet = new Set();

  (kelasList || []).forEach(k => {
    const name = String(k.Nama_Kelas || k['Nama Kelas'] || '').trim();
    if (name && !nonSantri.has(name.toUpperCase())) {
      classSet.add(name);
    }
  });

  (santriList || []).forEach(s => {
    const status = String(s.Status || s.status || 'aktif').trim().toLowerCase();
    const k = String(s.Kelas || s.kelas || '').trim();
    if ((status === 'aktif' || status === '') && k && !nonSantri.has(k.toUpperCase())) {
      classSet.add(k);
    }
  });

  return Array.from(classSet).sort((a, b) => a.localeCompare(b));
}

function getActiveSantriForClass(santriList, targetKelas) {
  return (santriList || []).filter(s => {
    const sK = String(s.Kelas || s.kelas || '').trim();
    const status = String(s.Status || s.status || 'aktif').trim().toLowerCase();
    return isKelasMatch(sK, targetKelas) && (status === 'aktif' || status === '');
  }).sort((a, b) => {
    const nameA = String(a.Nama_Santri || a.nama_santri || a.Nama || a.nama || '');
    const nameB = String(b.Nama_Santri || b.nama_santri || b.Nama || b.nama || '');
    return nameA.localeCompare(nameB);
  });
}

function bukaModalCetakTabelUjian(autoExportExcel) {
  ensureModalCetakTabelUjian();

  const selectedPmKelas = document.getElementById('pm_kelas') ? document.getElementById('pm_kelas').value : '';
  const modalEl = document.getElementById('modalCetakTabelUjian');
  const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
  if (!autoExportExcel) {
    modal.show();
  }

  const runAfterLoad = () => {
    const validClasses = getValidStudentClassesList(_examSantriCache, _examKelasCache);
    const categories = Array.from(new Set((_examAllMateriCache || []).map(m => String(m.kelas || '').trim()).filter(Boolean)));

    const selectEl = document.getElementById('ctu_select_kelas');
    if (selectEl) {
      let htmlOpts = '<option value="">-- Pilih Kelas --</option>';

      // 1. Kelas Spesifik
      htmlOpts += '<optgroup label="Pilih Kelas Spesifik">';
      validClasses.forEach(cName => {
        const count = getActiveSantriForClass(_examSantriCache, cName).length;
        htmlOpts += `<option value="${cName}">${cName} (${count} Santri)</option>`;
      });
      htmlOpts += '</optgroup>';

      // 2. Kategori Materi (Gabungan Sub-Kelas)
      if (categories.length > 0) {
        htmlOpts += '<optgroup label="Pilih Per Tingkat / Kategori Materi">';
        categories.forEach(cat => {
          const subClasses = validClasses.filter(cName => matchMateriKelasClient(cat, cName));
          if (subClasses.length > 1 || !validClasses.includes(cat)) {
            htmlOpts += `<option value="KAT:${cat}">Kategori: ${cat} (${subClasses.length} Kelas)</option>`;
          }
        });
        htmlOpts += '</optgroup>';
      }

      // 3. Semua Kelas Sekaligus
      htmlOpts += '<optgroup label="Cetak Massal">';
      htmlOpts += `<option value="__ALL__">Semua Kelas Aktif TPQ Sekaligus (${validClasses.length} Kelas)</option>`;
      htmlOpts += '</optgroup>';

      selectEl.innerHTML = htmlOpts;

      // Tentukan pilihan awal berdasarkan pm_kelas
      if (selectedPmKelas) {
        if (validClasses.includes(selectedPmKelas)) {
          selectEl.value = selectedPmKelas;
        } else if (categories.includes(selectedPmKelas)) {
          selectEl.value = 'KAT:' + selectedPmKelas;
        } else {
          selectEl.value = validClasses[0] || '';
        }
      } else {
        selectEl.value = validClasses[0] || '';
      }
    }

    renderPreviewTabelUjian();

    if (autoExportExcel) {
      exportTabelUjianExcel();
    }
  };

  if (_examSantriCache && _examKelasCache && _examAllMateriCache) {
    runAfterLoad();
    return;
  }

  showLoading('Memuat data santri & materi kelas...');
  google.script.run
    .withSuccessHandler(function(santriList) {
      _examSantriCache = santriList || [];
      google.script.run
        .withSuccessHandler(function(kelasList) {
          _examKelasCache = kelasList || [];
          google.script.run
            .withSuccessHandler(function(allMateri) {
              hideLoading();
              _examAllMateriCache = allMateri || [];
              runAfterLoad();
            })
            .withFailureHandler(function() {
              // Fallback jika getAllMateriKelas belum tersedia
              hideLoading();
              _examAllMateriCache = _pmCurrentMateriList || [];
              runAfterLoad();
            })
            .getAllMateriKelas();
        })
        .withFailureHandler(function(err) {
          hideLoading();
          showToast('Gagal memuat kelas: ' + err.message, 'error');
        })
        .getKelasList();
    })
    .withFailureHandler(function(err) {
      hideLoading();
      showToast('Gagal memuat santri: ' + err.message, 'error');
    })
    .getSantriList();
}

function getResolvedTargetClassesForExam() {
  const selectEl = document.getElementById('ctu_select_kelas');
  const val = selectEl ? selectEl.value : '';
  const validClasses = getValidStudentClassesList(_examSantriCache, _examKelasCache);

  if (!val) return [];
  if (val === '__ALL__') {
    return validClasses.filter(c => getActiveSantriForClass(_examSantriCache, c).length > 0);
  }
  if (val.startsWith('KAT:')) {
    const cat = val.slice(4);
    const matched = validClasses.filter(c => matchMateriKelasClient(cat, c) && getActiveSantriForClass(_examSantriCache, c).length > 0);
    return matched.length > 0 ? matched : [cat];
  }
  return [val];
}

function exportTabelUjianExcel() {
  const targetClasses = getResolvedTargetClassesForExam();
  if (targetClasses.length === 0) {
    showToast('Silakan pilih kelas terlebih dahulu', 'warning');
    return;
  }

  try {
    const ta = (document.getElementById('rn_ta') && document.getElementById('rn_ta').value) || '20262';
    const tanggalUjian = document.getElementById('ctu_tanggal_ujian') ? document.getElementById('ctu_tanggal_ujian').value.trim() : '';
    const namaPenguji = document.getElementById('ctu_nama_penguji') ? document.getElementById('ctu_nama_penguji').value.trim() : '';
    const extraRows = parseInt(document.getElementById('ctu_extra_rows') ? document.getElementById('ctu_extra_rows').value : '3', 10) || 0;

    const wb = XLSX.utils.book_new();

    targetClasses.forEach((kelasName, idx) => {
      const santriInClass = getActiveSantriForClass(_examSantriCache, kelasName);
      const materiList = resolveMateriForKelasClient(kelasName, _examAllMateriCache);
      const kInfo = (_examKelasCache || []).find(k => isKelasMatch(k.Nama_Kelas || k['Nama Kelas'], kelasName));
      const waliKelas = kInfo ? (kInfo.Ustadz_Wali || '-') : '-';

      const upperKelas = String(kelasName || '').trim().toUpperCase();
      const isManual = materiList.some(m => m.tipe === 'manual') || upperKelas.includes('DINIYAH');
      const isWeighted = !isManual && materiList.some(m => m.tipe === 'weighted');

      const aoa = [];
      aoa.push(['LEMBAR PENILAIAN UJIAN SANTRI - TPQ AL MABRUR SINGOSARI']);
      aoa.push(['Kelas', kelasName, '', 'Hari / Tanggal Ujian', tanggalUjian || '..............................']);
      aoa.push(['Wali Kelas', waliKelas, '', 'Nama Penguji', namaPenguji || '..............................']);
      aoa.push(['Tahun Ajaran', ta, '', 'Jumlah Peserta', santriInClass.length + ' Santri']);
      aoa.push([]);

      const headerRow = ['No', 'NIS', 'Nama Santri'];
      if (isManual) {
        materiList.forEach(m => headerRow.push(`${m.materi} (0-100)`));
        headerRow.push('Rata-rata', 'Catatan Penguji');
      } else if (isWeighted) {
        materiList.forEach(m => headerRow.push(`${m.materi} (Maks ${m.bobot})`));
        headerRow.push('Total Nilai', 'Catatan Penguji');
      } else {
        materiList.filter(m => m.tipe !== 'plus').forEach(m => headerRow.push(`${m.materi} (Bobot ${m.bobot})`));
        materiList.filter(m => m.tipe === 'plus').forEach(m => headerRow.push(`${m.materi} (Skor 1-${m.bobot || 5})`));
        headerRow.push('Nilai Akhir', 'Catatan Penguji');
      }
      aoa.push(headerRow);

      const blankCount = headerRow.length - 3;
      santriInClass.forEach((s, sIdx) => {
        const row = [
          sIdx + 1,
          s.NIS ? String(s.NIS) : '-',
          s.Nama_Santri || s.nama_santri || s.Nama || '-'
        ];
        for (let b = 0; b < blankCount; b++) row.push('');
        aoa.push(row);
      });

      for (let e = 0; e < extraRows; e++) {
        const row = [santriInClass.length + e + 1, '', ''];
        for (let b = 0; b < blankCount; b++) row.push('');
        aoa.push(row);
      }

      const ws = XLSX.utils.aoa_to_sheet(aoa);
      const colWidths = [{ wch: 5 }, { wch: 12 }, { wch: 28 }];
      for (let c = 3; c < headerRow.length - 1; c++) colWidths.push({ wch: 18 });
      colWidths.push({ wch: 24 });
      ws['!cols'] = colWidths;

      let sheetName = kelasName.replace(/[\\/?*\[\]:]/g, ' ').trim().slice(0, 28);
      if (!sheetName) sheetName = 'Kelas_' + (idx + 1);
      XLSX.utils.book_append_sheet(wb, ws, sheetName);
    });

    const cleanFileLabel = targetClasses.length === 1
      ? targetClasses[0].replace(/[^a-zA-Z0-9]/g, '_')
      : 'Semua_Kelas';
    XLSX.writeFile(wb, `Tabel_Penilaian_Ujian_${cleanFileLabel}_${ta}.xlsx`);
    showToast('File Excel Tabel Penilaian Ujian berhasil diunduh', 'success');
  } catch (err) {
    console.error('Export tabel ujian error:', err);
    showToast('Gagal export Excel: ' + err.message, 'error');
  }
}

          <h6>Silakan pilih kelas terlebih dahulu untuk memulai pengisian Bupres.</h6>
        </div>
      `;

    return;
  }
  
  if (container) {
    container.innerHTML = `

        <div class="text-muted fw-semibold">Memuat data Bupres kelas ${kelas}...</div>
      </div>

  google.script.run
    .withSuccessHandler(function(tmRes) {
      const tmInput = document.getElementById('bp_tatap_muka');

      if (tmInput && tmRes) {

        tmBadge.className = 'badge ' + (tmRes.is_specific ? 'bg-primary' : 'bg-secondary');
      }
      
      // 2. Ambil data santri aktif dan data bupres yang tersimpan
      google.script.run
        .withSuccessHandler(function(santriList) {
          google.script.run
            .withSuccessHandler(function(savedBupresList) {
              renderBupresTable(santriList, savedBupresList, kelas, ta);
            })
            .withFailureHandler(function(err) {
              renderBupresTable(santriList, [], kelas, ta);
            })

        .withFailureHandler(function(err) {

            container.innerHTML = `<div class="alert alert-danger">Gagal memuat data santri: ${err.message || err}</div>`;
          }
        })
        .getSantriList();
    })
    .withFailureHandler(function(err) {
      console.warn('Gagal ambil config TM:', err);
    })
    .getTatapMukaConfig(ta, kelas);
}

function recalculateAllBupres() {

function hitungBupresSantri(nis, changedInput) {
  const row = document.getElementById('row_bp_' + nis);
  if (!row) return;

  const tmInput = document.getElementById('bp_tatap_muka');
  const tatapMuka = tmInput ? (parseInt(tmInput.value) || 0) : 24;

  let b = parseInt(row.querySelector('.bp-b').value) || 0;
  let bMinus = parseInt(row.querySelector('.bp-b-minus').value) || 0;
  let cPlus = parseInt(row.querySelector('.bp-c-plus').value) || 0;
  let c = parseInt(row.querySelector('.bp-c').value) || 0;
  let cMinus = parseInt(row.querySelector('.bp-c-minus').value) || 0;
  let k = parseInt(row.querySelector('.bp-k').value) || 0;

  let totalEntries = b + bMinus + cPlus + c + cMinus + k;

  // SATPAM LEVEL 1: Jika total melebihi tatap muka saat diinput langsung sesuaikan & beri peringatan
  if (tatapMuka > 0 && totalEntries > tatapMuka) {
    if (changedInput) {
      const over = totalEntries - tatapMuka;
      const curVal = parseInt(changedInput.value) || 0;
      const adjustedVal = Math.max(0, curVal - over);
      changedInput.value = adjustedVal;

      // Re-read nilai yang telah dibatasi
      b = parseInt(row.querySelector('.bp-b').value) || 0;
      bMinus = parseInt(row.querySelector('.bp-b-minus').value) || 0;
      cPlus = parseInt(row.querySelector('.bp-c-plus').value) || 0;
      c = parseInt(row.querySelector('.bp-c').value) || 0;
      cMinus = parseInt(row.querySelector('.bp-c-minus').value) || 0;
      k = parseInt(row.querySelector('.bp-k').value) || 0;
      totalEntries = b + bMinus + cPlus + c + cMinus + k;

      const namaEl = row.querySelector('td:nth-child(3) .fw-bold');
      const namaSantri = namaEl ? namaEl.textContent.trim() : 'Santri';

      Swal.mixin({
        toast: true,
        position: 'top-end',
        showConfirmButton: false,
        timer: 3500,
        timerProgressBar: true
      }).fire({
        icon: 'warning',
        title: 'Satpam: Maksimal ' + tatapMuka + ' Pertemuan!',
        text: 'Total nilai untuk ' + namaSantri + ' tidak boleh lebih dari ' + tatapMuka + ' (disesuaikan jadi ' + adjustedVal + ').'
      });
    }
  }

  const isOver = tatapMuka > 0 && totalEntries > tatapMuka;
  if (isOver) {
    row.classList.add('table-danger');
  } else {
    row.classList.remove('table-danger');
  }

  const totalNilai = (b * 95) + (bMinus * 90) + (cPlus * 83) + (c * 80) + (cMinus * 73) + (k * 70);

  let poinBCK = 0;
  if (tatapMuka > 0) {
    poinBCK = Number((totalNilai / tatapMuka).toFixed(2));
  }

  // Update Total Nilai
  const totalEl = document.getElementById('bp_total_' + nis);
  if (totalEl) totalEl.textContent = totalNilai;

  // Update Badge Pertemuan
  const countBadge = document.getElementById('bp_count_badge_' + nis);
  if (countBadge) {
    countBadge.textContent = `${totalEntries}/${tatapMuka}`;
    if (tatapMuka > 0 && totalEntries === tatapMuka) {
      countBadge.className = 'badge bg-success font-monospace';
      countBadge.title = 'Tuntas (pas tatap muka)';
    } else if (totalEntries > tatapMuka) {
      countBadge.className = 'badge bg-danger font-monospace';
      countBadge.title = 'Melebihi target tatap muka!';
    } else if (totalEntries > 0) {
      countBadge.className = 'badge bg-warning text-dark font-monospace';
      countBadge.title = 'Belum mencapai target tatap muka';
    } else {
      countBadge.className = 'badge bg-secondary font-monospace';
      countBadge.title = 'Belum diisi';
    }
  }

  // Update Poin BCK
  const poinBadge = document.getElementById('bp_poin_badge_' + nis);
  if (poinBadge) {
    poinBadge.textContent = poinBCK.toFixed(2);
    if (poinBCK >= 90) {
      poinBadge.className = 'badge fs-6 px-2 py-1 bg-success';
    } else if (poinBCK >= 80) {
      poinBadge.className = 'badge fs-6 px-2 py-1 bg-primary';
    } else if (poinBCK >= 70) {
      poinBadge.className = 'badge fs-6 px-2 py-1 bg-warning text-dark';
    } else if (poinBCK > 0) {
      poinBadge.className = 'badge fs-6 px-2 py-1 bg-danger';
    } else {
      poinBadge.className = 'badge fs-6 px-2 py-1 bg-secondary';
    }
  }

  // Jika baris ini adalah santri yang sedang aktif di Key Listener, perbarui info panel atas
  if (typeof _activeBupresNis !== 'undefined' && _activeBupresNis === nis) {
    updateActiveBupresPanelInfo(nis);
  }
}

let _activeBupresNis = '';
let _bupresKeyUndoStack = [];
let _lastBupresKeydownTime = 0;

function focusBupresMobileKeyboard() {
  const toggle = document.getElementById('bp_key_mode_toggle');
  if (toggle && !toggle.checked) return;
  const proxy = document.getElementById('bp_mobile_key_proxy');
  if (proxy) {
    proxy.value = ' ';
    try {
      proxy.focus({ preventScroll: true });
    } catch (e) {
      proxy.focus();
    }
  }
}

function onBupresRowClick(e, nis) {
  const target = e ? e.target : null;
  const tag = target && target.tagName ? target.tagName.toUpperCase() : '';
  const isInteractive = (tag === 'INPUT' || tag === 'BUTTON' || tag === 'SELECT' || tag === 'TEXTAREA');
  setActiveBupresSantri(nis, false);
  if (!isInteractive) {
    focusBupresMobileKeyboard();
  }
}

function resolveBupresShortcutKey(keyStr, codeStr) {
  const k = String(keyStr || '').toUpperCase();
  const c = String(codeStr || '');
  const map = {
    '1': { col: 'bp-b', btn: '1' },
    '2': { col: 'bp-b-minus', btn: '2' },
    '3': { col: 'bp-c-plus', btn: '3' },
    '4': { col: 'bp-c', btn: '4' },
    '5': { col: 'bp-c-minus', btn: '5' },
    '6': { col: 'bp-k', btn: '6' },
    'F': { col: 'bp-b', btn: '1' },
    'G': { col: 'bp-b-minus', btn: '2' },
    'H': { col: 'bp-c-plus', btn: '3' },
    'J': { col: 'bp-c', btn: '4' },
    'K': { col: 'bp-c-minus', btn: '5' },
    'L': { col: 'bp-k', btn: '6' }
  };
  if (map[k]) return map[k];
  if (c === 'Digit1' || c === 'Numpad1') return map['1'];
  if (c === 'Digit2' || c === 'Numpad2') return map['2'];
  if (c === 'Digit3' || c === 'Numpad3') return map['3'];
  if (c === 'Digit4' || c === 'Numpad4') return map['4'];
  if (c === 'Digit5' || c === 'Numpad5') return map['5'];
  if (c === 'Digit6' || c === 'Numpad6') return map['6'];
  return null;
}

function onBupresMobileProxyKeydown(el, e) {
  const toggle = document.getElementById('bp_key_mode_toggle');
  if (toggle && !toggle.checked) return;

  if (e.key === 'Enter' || e.key === 'ArrowDown') {
    e.preventDefault();
    _lastBupresKeydownTime = Date.now();
    el.value = ' ';
    pilihSantriBupresRelative(1, true);
    return;
  }
  if (e.key === 'ArrowUp') {
    e.preventDefault();
    _lastBupresKeydownTime = Date.now();
    el.value = ' ';
    pilihSantriBupresRelative(-1, true);
    return;
  }
  if (e.key === 'Backspace' || e.key === '0') {
    e.preventDefault();
    _lastBupresKeydownTime = Date.now();
    el.value = ' ';
    undoLastBupresKey();
    return;
  }

  const resolved = resolveBupresShortcutKey(e.key, e.code);
  if (resolved) {
    e.preventDefault();
    _lastBupresKeydownTime = Date.now();
    const delta = e.shiftKey ? -1 : 1;
    triggerBupresKeyAction(resolved.col, delta, resolved.btn);
    el.value = ' ';
  }
}

function onBupresMobileProxyInput(el, e) {
  const toggle = document.getElementById('bp_key_mode_toggle');
  if (toggle && !toggle.checked) {
    el.value = ' ';
    return;
  }

  // Cegah eksekusi ganda jika sudah ditangani oleh keydown fisik
  if (Date.now() - _lastBupresKeydownTime < 60) {
    el.value = ' ';
    return;
  }

  if (e && (e.inputType === 'insertLineBreak' || e.inputType === 'insertParagraph')) {
    el.value = ' ';
    pilihSantriBupresRelative(1, true);
    return;
  }

  const rawVal = el.value || '';
  if (rawVal === '' || (e && e.inputType && e.inputType.indexOf('deleteContent') === 0)) {
    el.value = ' ';
    undoLastBupresKey();
    return;
  }

  const typed = rawVal.trim().toUpperCase();
  for (let i = 0; i < typed.length; i++) {
    const ch = typed[i];
    if (ch === '0') {
      undoLastBupresKey();
      continue;
    }
    const resolved = resolveBupresShortcutKey(ch, '');
    if (resolved) {
      triggerBupresKeyAction(resolved.col, 1, resolved.btn);
    }
  }

  el.value = ' ';
}

function onToggleBupresKeyMode() {
  const toggle = document.getElementById('bp_key_mode_toggle');
  const isEnabled = toggle ? toggle.checked : false;
  if (isEnabled) {
    showToast('Pintasan Angka Bupres (1–6) diaktifkan', 'info');
  } else {
    showToast('Pintasan Angka Bupres (1–6) dinonaktifkan', 'warning');
  }
}

function setActiveBupresSantri(nis, shouldScroll) {
  if (!nis) return;
  _activeBupresNis = String(nis).trim();

  const allRows = document.querySelectorAll('#bp_table tbody tr');
  allRows.forEach(r => {
    const rNis = r.getAttribute('data-nis');
    const ind = document.getElementById('bp_ind_' + rNis);
    if (rNis === _activeBupresNis) {
      r.classList.add('bp-active-row');
      if (ind) ind.style.display = 'inline-block';
      if (shouldScroll) {
        r.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    } else {
      r.classList.remove('bp-active-row');
      if (ind) ind.style.display = 'none';
    }
  });

  updateActiveBupresPanelInfo(_activeBupresNis);
}

function updateActiveBupresPanelInfo(nis) {
  const row = document.getElementById('row_bp_' + nis);
  if (!row) return;

  const idx = row.getAttribute('data-idx') || '';
  const nama = row.getAttribute('data-nama-asli') || '-';
  const countBadge = document.getElementById('bp_count_badge_' + nis);
  const poinBadge = document.getElementById('bp_poin_badge_' + nis);

  const labelEl = document.getElementById('bp_active_santri_label');
  const tmEl = document.getElementById('bp_active_santri_tm');
  const poinEl = document.getElementById('bp_active_santri_poin');

  if (labelEl) {
    labelEl.textContent = `${idx ? idx + '. ' : ''}${nama} (${nis})`;
  }
  if (tmEl && countBadge) {
    tmEl.textContent = countBadge.textContent;
    tmEl.className = countBadge.className + ' ms-1';
  }
  if (poinEl && poinBadge) {
    poinEl.textContent = 'Poin: ' + poinBadge.textContent;
    poinEl.className = poinBadge.className.replace('fs-6', '') + ' ms-1';
  }
}

function getVisibleBupresRows() {
  const allRows = Array.from(document.querySelectorAll('#bp_table tbody tr'));
  return allRows.filter(r => r.style.display !== 'none');
}

function pilihSantriBupresRelative(step, keepMobileKeyboard) {
  const visibleRows = getVisibleBupresRows();
  if (visibleRows.length === 0) return;

  let curIdx = visibleRows.findIndex(r => r.getAttribute('data-nis') === _activeBupresNis);
  if (curIdx === -1) {
    curIdx = 0;
  } else {
    curIdx = curIdx + step;
    if (curIdx < 0) curIdx = 0;
    if (curIdx >= visibleRows.length) curIdx = visibleRows.length - 1;
  }

  const targetNis = visibleRows[curIdx].getAttribute('data-nis');
  if (targetNis) {
    if (document.activeElement && document.activeElement.classList && document.activeElement.classList.contains('bp-inp')) {
      document.activeElement.blur();
    }
    setActiveBupresSantri(targetNis, true);
    if (keepMobileKeyboard) {
      focusBupresMobileKeyboard();
    }
  }
}

function triggerBupresKeyAction(colClass, delta, keyChar) {
  if (!_activeBupresNis) {
    const visibleRows = getVisibleBupresRows();
    if (visibleRows.length > 0) {
      setActiveBupresSantri(visibleRows[0].getAttribute('data-nis'), false);
    }
  }
  if (!_activeBupresNis) return;

  const row = document.getElementById('row_bp_' + _activeBupresNis);
  if (!row) return;

  const inp = row.querySelector('.' + colClass);
  if (!inp) return;

  // Blur input angka agar tidak bentrok dengan ketikan manual
  if (document.activeElement && document.activeElement.classList && document.activeElement.classList.contains('bp-inp')) {
    document.activeElement.blur();
  }

  const prevVal = parseInt(inp.value) || 0;
  const nextVal = Math.max(0, prevVal + delta);
  inp.value = nextVal;

  hitungBupresSantri(_activeBupresNis, inp);

  const finalVal = parseInt(inp.value) || 0;
  if (finalVal !== prevVal) {
    _bupresKeyUndoStack.push({
      nis: _activeBupresNis,
      colClass: colClass,
      prevVal: prevVal,
      newVal: finalVal
    });
    if (_bupresKeyUndoStack.length > 100) _bupresKeyUndoStack.shift();
  }

  // Efek visual flash pada input & tombol pintasan
  inp.classList.add('bp-inp-flash');
  setTimeout(() => inp.classList.remove('bp-inp-flash'), 180);

  if (keyChar) {
    const btnEl = document.getElementById('bp_keybtn_' + keyChar.toUpperCase());
    if (btnEl) {
      btnEl.classList.add('bp-key-flash');
      setTimeout(() => btnEl.classList.remove('bp-key-flash'), 160);
    }
  }
}

function undoLastBupresKey() {
  if (_bupresKeyUndoStack.length === 0) {
    showToast('Belum ada riwayat pintasan untuk di-undo', 'info');
    return;
  }

  const lastAction = _bupresKeyUndoStack.pop();
  if (!lastAction || !lastAction.nis) return;

  setActiveBupresSantri(lastAction.nis, true);
  const row = document.getElementById('row_bp_' + lastAction.nis);
  if (!row) return;

  const inp = row.querySelector('.' + lastAction.colClass);
  if (!inp) return;

  inp.value = lastAction.prevVal;
  hitungBupresSantri(lastAction.nis, inp);

  inp.classList.add('bp-inp-flash');
  setTimeout(() => inp.classList.remove('bp-inp-flash'), 200);
}

function resetBupresSantriAktif() {
  if (!_activeBupresNis) return;
  const row = document.getElementById('row_bp_' + _activeBupresNis);
  if (!row) return;

  const nama = row.getAttribute('data-nama-asli') || 'Santri ini';
  const inputs = row.querySelectorAll('.bp-inp');
  inputs.forEach(inp => {
    inp.value = 0;
  });
  hitungBupresSantri(_activeBupresNis);
  showToast(`Nilai Bupres ${nama} di-reset ke 0`, 'info');
}

function ensureBupresKeyListenerAttached() {
  if (window._bupresKeydownListenerRegistered) return;
  window._bupresKeydownListenerRegistered = true;

  document.addEventListener('keydown', function(e) {
    // Pastikan tab Input Bupres sedang aktif dan terlihat
    const tabPane = document.getElementById('tabInputBupres');
    if (!tabPane || !tabPane.classList.contains('active') || tabPane.offsetParent === null) return;

    // Pastikan toggle pintasan keyboard aktif
    const toggle = document.getElementById('bp_key_mode_toggle');
    if (toggle && !toggle.checked) return;

    // Abaikan jika ada modal terbuka atau kombinasi Ctrl / Alt / Meta
    if (e.ctrlKey || e.altKey || e.metaKey) return;
    if (document.querySelector('.modal.show')) return;

    // Cek elemen yang sedang fokus
    const activeEl = document.activeElement;
    if (activeEl) {
      const tag = (activeEl.tagName || '').toUpperCase();
      const id = activeEl.id || '';
      const isBupresNumberInput = activeEl.classList && activeEl.classList.contains('bp-inp');

      // Abaikan jika fokus sedang di bp_mobile_key_proxy karena sudah ditangani oleh onBupresMobileProxyKeydown
      if (id === 'bp_mobile_key_proxy') {
        return;
      }

      // Jika sedang mengetik di kotak input angka manual (.bp-inp), pencarian, catatan, TA, atau tatap muka, biarkan mengetik normal
      if ((tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') && id !== 'bp_key_mode_toggle') {
        if (isBupresNumberInput) {
          const focusedNis = activeEl.getAttribute('data-nis');
          if (focusedNis && focusedNis !== _activeBupresNis) {
            setActiveBupresSantri(focusedNis, false);
          }
        }
        return;
      }
    }

    const resolved = resolveBupresShortcutKey(e.key, e.code);
    if (resolved) {
      e.preventDefault();
      const delta = e.shiftKey ? -1 : 1;
      triggerBupresKeyAction(resolved.col, delta, resolved.btn);
      return;
    }

    if (e.key === 'Enter' || e.key === 'ArrowDown') {
      e.preventDefault();
      pilihSantriBupresRelative(1);
      return;
    }

    if (e.key === 'ArrowUp') {
      e.preventDefault();
      pilihSantriBupresRelative(-1);
      return;
    }

    // Backspace atau 0 untuk Undo jika tidak sedang mengedit angka manual di dalam kotak input
    const isEditingNumberInput = activeEl && activeEl.classList && activeEl.classList.contains('bp-inp');
    if ((e.key === 'Backspace' || e.key === '0') && !isEditingNumberInput) {
      e.preventDefault();
      undoLastBupresKey();
    }
  });
}

function filterBupresTable() {
  const keyword = (document.getElementById('bp_search_santri') ? document.getElementById('bp_search_santri').value : '').toLowerCase().trim();
  const rows = document.querySelectorAll('#bp_table tbody tr');
  let count = 0;

  rows.forEach(r => {
    const nis = r.getAttribute('data-nis') || '';
    const nama = r.getAttribute('data-nama') || '';
    if (!keyword || nis.includes(keyword) || nama.includes(keyword)) {
      r.style.display = '';
      count++;
    } else {
      r.style.display = 'none';
    }
  });

  const infoCount = document.getElementById('bp_info_count');
  if (infoCount) infoCount.textContent = `${count} Santri`;
}

function simpanPengaturanTatapMuka() {
  const ta = document.getElementById('bp_ta') ? document.getElementById('bp_ta').value : '';
  const kelas = document.getElementById('bp_kelas') ? document.getElementById('bp_kelas').value : '';
  const tmInput = document.getElementById('bp_tatap_muka');
  const jml = parseInt(tmInput ? tmInput.value : 0);

  if (!jml || jml <= 0) {
    Swal.fire('Peringatan', 'Jumlah tatap muka harus lebih dari 0', 'warning');
    return;
  }

  Swal.fire({
    title: 'Simpan Standar Tatap Muka?',
    html: `Jumlah tatap muka: <strong>${jml} pertemuan</strong>.<br>Terapkan ke mana?`,
    icon: 'question',
    showCancelButton: true,
    showDenyButton: true,
    confirmButtonText: kelas ? `Kelas ${kelas} Saja` : 'Kelas Ini Saja',
    denyButtonText: 'SEMUA Kelas (Global TA)',
    cancelButtonText: 'Batal'
  }).then((result) => {
    if (result.isConfirmed) {
      if (!kelas) {
        Swal.fire('Peringatan', 'Pilih kelas terlebih dahulu', 'warning');
        return;
      }
      showLoading('Menyimpan tatap muka...');
      google.script.run
        .withSuccessHandler(function(res) {
          hideLoading();
          if (res.success) {
            Swal.fire('Berhasil', res.message, 'success');
            const tmBadge = document.getElementById('bp_tm_badge');
            if (tmBadge) {
              tmBadge.textContent = 'Khusus Kelas Ini';
              tmBadge.className = 'badge bg-primary';
            }
            recalculateAllBupres();
          } else {
            Swal.fire('Gagal', res.message, 'error');
          }
        })
        .withFailureHandler(function(err) {
          hideLoading();
          Swal.fire('Error', err.message, 'error');
        })
        .saveTatapMukaConfig(ta, kelas, jml, false);
    } else if (result.isDenied) {
      showLoading('Menyimpan tatap muka global...');
      google.script.run
        .withSuccessHandler(function(res) {
          hideLoading();
          if (res.success) {
            Swal.fire('Berhasil', res.message, 'success');
            const tmBadge = document.getElementById('bp_tm_badge');
            if (tmBadge) {
              tmBadge.textContent = 'Standar TPQ';
              tmBadge.className = 'badge bg-secondary';
            }
            recalculateAllBupres();
          } else {
            Swal.fire('Gagal', res.message, 'error');
          }
        })
        .withFailureHandler(function(err) {
          hideLoading();
          Swal.fire('Error', err.message, 'error');
        })
        .saveTatapMukaConfig(ta, kelas, jml, true);
    }
  });
}

function simpanSemuaBupres() {
  const ta = document.getElementById('bp_ta') ? document.getElementById('bp_ta').value : '';
  const kelas = document.getElementById('bp_kelas') ? document.getElementById('bp_kelas').value : '';
  const tmInput = document.getElementById('bp_tatap_muka');
  const tatapMuka = parseInt(tmInput ? tmInput.value : 0) || 24;

  if (!kelas) {
    Swal.fire('Peringatan', 'Silakan pilih kelas terlebih dahulu!', 'warning');
    return;
  }

  const rows = document.querySelectorAll('#bp_table tbody tr');
  if (rows.length === 0) {
    Swal.fire('Info', 'Tidak ada data santri untuk disimpan', 'info');
    return;
  }

  // SATPAM LEVEL 2: Validasi ketat sebelum simpan
  const invalidSantri = [];
  rows.forEach(r => {
    const nis = r.getAttribute('data-nis');
    const nama = r.querySelector('td:nth-child(3) .fw-bold').textContent.trim();
    const b = parseInt(r.querySelector('.bp-b').value) || 0;
    const bMinus = parseInt(r.querySelector('.bp-b-minus').value) || 0;
    const cPlus = parseInt(r.querySelector('.bp-c-plus').value) || 0;
    const c = parseInt(r.querySelector('.bp-c').value) || 0;
    const cMinus = parseInt(r.querySelector('.bp-c-minus').value) || 0;
    const k = parseInt(r.querySelector('.bp-k').value) || 0;
    const total = b + bMinus + cPlus + c + cMinus + k;

    if (tatapMuka > 0 && total > tatapMuka) {
      invalidSantri.push({ nis: nis, nama: nama, total: total, row: r });
      r.classList.add('table-danger');
    } else {
      r.classList.remove('table-danger');
    }
  });

  if (invalidSantri.length > 0) {
    invalidSantri[0].row.scrollIntoView({ behavior: 'smooth', block: 'center' });
    
    const listHtml = invalidSantri.slice(0, 5).map(it => `
      <li><strong>${it.nama}</strong>: Total input = <span class="text-danger fw-bold">${it.total}</span> (Batas Tatap Muka: ${tatapMuka})</li>
    `).join('');
    const sisa = invalidSantri.length > 5 ? `<li class="text-muted">...dan ${invalidSantri.length - 5} santri lainnya</li>` : '';

    Swal.fire({
      icon: 'error',
      title: 'Satpam Bupres: Melebihi Tatap Muka!',
      html: `
        <p class="text-danger mb-2">Total Kategori Nilai (B + B- + C+ + C + C- + K) tidak boleh lebih dari <strong>${tatapMuka}</strong> tatap muka!</p>
        <div class="text-start bg-light p-3 rounded border small">
          <ul class="mb-0 ps-3">
            ${listHtml}
            ${sisa}
          </ul>
        </div>
        <p class="text-muted small mt-2 mb-0">Silakan sesuaikan kembali nilai santri yang bertanda merah.</p>
      `,
      confirmButtonText: 'Perbaiki Sekarang'
    });
    return;
  }

  const dataArray = [];
  rows.forEach(r => {
    const nis = r.getAttribute('data-nis');
    const nama = r.querySelector('td:nth-child(3) .fw-bold').textContent.trim();
    const b = parseInt(r.querySelector('.bp-b').value) || 0;
    const bMinus = parseInt(r.querySelector('.bp-b-minus').value) || 0;
    const cPlus = parseInt(r.querySelector('.bp-c-plus').value) || 0;
    const c = parseInt(r.querySelector('.bp-c').value) || 0;
    const cMinus = parseInt(r.querySelector('.bp-c-minus').value) || 0;
    const k = parseInt(r.querySelector('.bp-k').value) || 0;
    const catatan = r.querySelector('#bp_catatan_' + nis) ? r.querySelector('#bp_catatan_' + nis).value.trim() : '';

    dataArray.push({
      tahun_ajaran: ta,
      kelas: kelas,
      nis: nis,
      nama_santri: nama,
      b: b,
      b_minus: bMinus,
      c_plus: cPlus,
      c: c,
      c_minus: cMinus,
      k: k,
      tatap_muka: tatapMuka,
      catatan: catatan,
      input_oleh: currentUser ? (currentUser.nama || currentUser.username) : 'ustadz'
    });
  });

  showLoading('Menyimpan data Bupres...');
  google.script.run
    .withSuccessHandler(function(res) {
      hideLoading();
      if (res.success) {
        Swal.fire({
          icon: 'success',
          title: 'Tersimpan!',
          text: res.message,
          timer: 2000,
          showConfirmButton: false
        });
      } else {
        Swal.fire('Gagal', res.message, 'error');
      }
    })
    .withFailureHandler(function(err) {
      hideLoading();
      Swal.fire('Error', 'Gagal menyimpan Bupres: ' + (err.message || err), 'error');
    })
    .saveBatchBupres(dataArray);
}

function exportBupresExcel() {
  const ta = document.getElementById('bp_ta') ? document.getElementById('bp_ta').value : '';
  const kelas = document.getElementById('bp_kelas') ? document.getElementById('bp_kelas').value : '';
  const tmInput = document.getElementById('bp_tatap_muka');
  const tatapMuka = tmInput ? tmInput.value : 24;

  const rows = document.querySelectorAll('#bp_table tbody tr');
  if (rows.length === 0) {
    Swal.fire('Info', 'Tidak ada data untuk diexport', 'info');
    return;
  }

  const exportData = [];
  exportData.push(['REKAP NILAI BUKU PRESTASI (BUPRES) TPQ AL MABRUR']);
  exportData.push(['Kelas', kelas]);
  exportData.push(['Tahun Ajaran', ta]);
  exportData.push(['Jumlah Tatap Muka', tatapMuka + ' Pertemuan']);
  exportData.push(['Standar Poin Nilai', 'B: 95 | B-: 90 | C+: 83 | C: 80 | C-: 73 | K: 70']);
  exportData.push(['Rumus', 'Poin BCK = Total Nilai / Jumlah Tatap Muka']);
  exportData.push(['Waktu Export', new Date().toLocaleString('id-ID')]);
  exportData.push([]);
  exportData.push([
    'No', 'NIS', 'Nama Santri', 
    'B (95)', 'B- (90)', 'C+ (83)', 'C (80)', 'C- (73)', 'K (70)', 
    'Total Pertemuan', 'Total Nilai', 'Poin Nilai BCK'
  ]);

  rows.forEach((r, idx) => {
    const nis = r.getAttribute('data-nis');
    const nama = r.querySelector('td:nth-child(3) .fw-bold').textContent.trim();
    const b = parseInt(r.querySelector('.bp-b').value) || 0;
    const bMinus = parseInt(r.querySelector('.bp-b-minus').value) || 0;
    const cPlus = parseInt(r.querySelector('.bp-c-plus').value) || 0;
    const c = parseInt(r.querySelector('.bp-c').value) || 0;
    const cMinus = parseInt(r.querySelector('.bp-c-minus').value) || 0;
    const k = parseInt(r.querySelector('.bp-k').value) || 0;
    const totalEntries = b + bMinus + cPlus + c + cMinus + k;
    const totalNilai = (b * 95) + (bMinus * 90) + (cPlus * 83) + (c * 80) + (cMinus * 73) + (k * 70);
    const tmInt = parseInt(tatapMuka) || 24;
    const poin = tmInt > 0 ? (totalNilai / tmInt).toFixed(2) : '0';

    exportData.push([
      idx + 1, nis, nama, b, bMinus, cPlus, c, cMinus, k, totalEntries, totalNilai, poin
    ]);
  });

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(exportData);
  XLSX.utils.book_append_sheet(wb, ws, 'Bupres');
  const filename = `Bupres_${kelas.replace(/[^a-zA-Z0-9]/g, '_')}_${ta}.xlsx`;
  XLSX.writeFile(wb, filename);
}

let _pantauKenaikanCache = null;

function loadPantauKenaikanData() {
  const kelasVal = document.getElementById('pk_kelas') ? document.getElementById('pk_kelas').value : '';
  const ta = document.getElementById('pk_ta') ? document.getElementById('pk_ta').value.trim() : '';
  const resContainer = document.getElementById('pk_result');

  if (!kelasVal) {
    if (resContainer) {
      resContainer.innerHTML = `
        <div class="text-center py-5 text-muted border rounded bg-light">
          <i class="fas fa-chart-line fa-3x mb-3 text-secondary opacity-50"></i>
          <h6>Silakan pilih kelas terlebih dahulu untuk memantau kenaikan kelas santri.</h6>
        </div>
      `;
    }
    return;
  }

  const queryKelas = kelasVal === 'ALL' ? '' : kelasVal;
  const labelKelas = kelasVal === 'ALL' ? 'Semua Kelas' : ('Kelas ' + kelasVal);

  if (resContainer) {
    resContainer.innerHTML = `
      <div class="text-center py-5 border rounded bg-white shadow-sm">
        <div class="spinner-border text-primary mb-2" role="status"></div>
        <div class="fw-semibold text-muted">Memuat data Pantau Kenaikan <strong>${labelKelas}</strong>...</div>
      </div>
    `;
  }

  showLoading('Memuat data Pantau Kenaikan ' + labelKelas + '...');

  google.script.run
    .withSuccessHandler(function(payload) {
      hideLoading();
      if (!payload || !payload.success) {
        if (resContainer) {
          resContainer.innerHTML = `<div class="alert alert-danger">Gagal memuat data: ${(payload && payload.message) || 'Tidak ada respon server'}</div>`;
        }
        return;
      }

      const santriList = payload.santriList || [];
      const filteredSantri = santriList.filter(s => {
        const sK = String(s.Kelas || s.kelas || '').trim();
        if (!sK || sK === '-') return false;
        const matchK = !queryKelas || isKelasMatch(sK, queryKelas);
        const status = String(s.Status || s.status || 'aktif').trim().toLowerCase();
        return matchK && (status === 'aktif' || status === '');
      }).sort((a, b) => {
        const kA = String(a.Kelas || a.kelas || '').trim();
        const kB = String(b.Kelas || b.kelas || '').trim();
        if (!queryKelas && kA !== kB) return kA.localeCompare(kB);
        const nameA = String(a.Nama_Santri || a.nama_santri || a.Nama || a.nama || '').trim();
        const nameB = String(b.Nama_Santri || b.nama_santri || b.Nama || b.nama || '').trim();
        return nameA.localeCompare(nameB);
      });

      _pantauKenaikanCache = {
        kelas: queryKelas,
        kelasLabel: labelKelas,
        ta: ta,
        santriList: filteredSantri,
        materiList: (payload.materiList || []).slice().sort((a, b) => (Number(a.urutan) || 0) - (Number(b.urutan) || 0)),
        materiByKelasMap: payload.materiByKelasMap || {},
        nilaiList: payload.nilaiList || [],
        bupresList: payload.bupresList || [],
        tmConfig: payload.tmConfig || { tatap_muka: 24 },
        absenList: payload.absenList || []
      };

      renderPantauKenaikanTable();
    })
    .withFailureHandler(function(err) {
      hideLoading();
      if (resContainer) {
        resContainer.innerHTML = `<div class="alert alert-danger">Gagal memuat data Pantau Kenaikan: ${err.message || err}</div>`;
      }
    })
    .getDataCetakRapor(queryKelas, ta);
}

function getFilteredPantauKenaikanRows() {
  if (!_pantauKenaikanCache) return { rows: [], totalAll: 0, totalNaik: 0, totalMengulang: 0 };

  const statusFilter = document.getElementById('pk_status') ? document.getElementById('pk_status').value : 'ALL';
  const keyword = (document.getElementById('pk_search') ? document.getElementById('pk_search').value : '').toLowerCase().trim();

  const allComputed = (_pantauKenaikanCache.santriList || []).map(s => hitungDataRaporSantri(s, _pantauKenaikanCache));

  const totalAll = allComputed.length;
  const totalNaik = allComputed.filter(d => d.isNaikKelas).length;
  const totalMengulang = totalAll - totalNaik;

  const filtered = allComputed.filter(d => {
    if (statusFilter === 'NAIK' && !d.isNaikKelas) return false;
    if (statusFilter === 'MENGULANG' && d.isNaikKelas) return false;
    if (keyword) {
      const matchNama = String(d.nama || '').toLowerCase().includes(keyword);
      const matchNis = String(d.nis || '').toLowerCase().includes(keyword);
      const matchKelas = String(d.kelas || '').toLowerCase().includes(keyword);
      if (!matchNama && !matchNis && !matchKelas) return false;
    }
    return true;
  });

  return {
    rows: filtered,
    totalAll,
    totalNaik,
    totalMengulang
  };
}

function renderPantauKenaikanTable() {
  const resContainer = document.getElementById('pk_result');
  if (!resContainer || !_pantauKenaikanCache) return;

  const { rows, totalAll, totalNaik, totalMengulang } = getFilteredPantauKenaikanRows();
  const isAllKelas = !_pantauKenaikanCache.kelas;

  let tbodyHtml = '';
  if (rows.length === 0) {
    tbodyHtml = `
      <tr>
        <td colspan="6" class="text-center py-4 text-muted">Tidak ada data santri yang sesuai dengan filter.</td>
      </tr>
    `;
  } else {
    rows.forEach((d, idx) => {
      const ketBadge = d.isNaikKelas
        ? `<span class="badge bg-success px-3 py-1">NAIK KELAS</span>`
        : `<span class="badge bg-danger px-3 py-1">MENGULANG</span>`;
      const kelasSub = isAllKelas ? `<span class="badge bg-light text-secondary border ms-2">${d.kelas}</span>` : '';

      tbodyHtml += `
        <tr>
          <td class="text-center fw-semibold text-muted">${idx + 1}</td>
          <td class="fw-bold text-dark">${d.nama}${kelasSub}</td>
          <td class="text-center fw-semibold">${d.totalNilaiUjian}</td>
          <td class="text-center fw-semibold">${d.bupres.nilaiHarian.toFixed(2)}</td>
          <td class="text-center fw-bold ${d.isNaikKelas ? 'text-success' : 'text-danger'}">${d.hasilAkhir.toFixed(2)}</td>
          <td class="text-center">${ketBadge}</td>
        </tr>
      `;
    });
  }

  resContainer.innerHTML = `
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div class="d-flex flex-wrap gap-2 align-items-center">
        <span class="badge bg-primary px-3 py-2">Total Santri: ${totalAll}</span>
        <span class="badge bg-success px-3 py-2">Naik Kelas: ${totalNaik}</span>
        <span class="badge bg-danger px-3 py-2">Mengulang: ${totalMengulang}</span>
      </div>
      <div class="small text-muted">
        <strong>Rumus Rata2:</strong> ((Nilai Rapor &times; 2) + Nilai Bupres) &divide; 3 &nbsp;|&nbsp; <strong>KKM:</strong> 80
      </div>
    </div>

    <div class="table-responsive shadow-sm border rounded bg-white">
      <table class="table table-bordered table-hover align-middle mb-0">
        <thead class="table-primary text-center align-middle">
          <tr>
            <th style="width: 55px;">No</th>
            <th class="text-start">Nama</th>
            <th style="width: 130px;">Nilai Rapor</th>
            <th style="width: 130px;">Nilai Bupres</th>
            <th style="width: 130px;">Rata2</th>
            <th style="width: 160px;">Keterangan</th>
          </tr>
        </thead>
        <tbody>
          ${tbodyHtml}
        </tbody>
      </table>
    </div>
  `;
}

function exportPantauKenaikanExcel() {
  if (!_pantauKenaikanCache) {
    Swal.fire('Info', 'Silakan pilih kelas dan muat data terlebih dahulu', 'info');
    return;
  }

  const { rows } = getFilteredPantauKenaikanRows();
  if (rows.length === 0) {
    Swal.fire('Info', 'Tidak ada data untuk diexport', 'info');

  }

  const exportData = [];
  exportData.push(['REKAP PANTAU KENAIKAN KELAS SANTRI TPQ AL MABRUR']);
  exportData.push(['Kelas', _pantauKenaikanCache.kelasLabel]);
  exportData.push(['Tahun Ajaran', _pantauKenaikanCache.ta]);

      d.nama,

  });

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(exportData);
  XLSX.utils.book_append_sheet(wb, ws, 'Pantau Kenaikan');
  const filename = `Pantau_Kenaikan_${_pantauKenaikanCache.kelasLabel.replace(/[^a-zA-Z0-9]/g, '_')}_${_pantauKenaikanCache.ta}.xlsx`;
  XLSX.writeFile(wb, filename);
}
