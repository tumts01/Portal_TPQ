function refreshPendaftaranData() {
  showLoading('Memuat data pendaftaran...');

  google.script.run
    .withSuccessHandler(function(kelasList) {
      _pendaftaranKelasList = kelasList || [];
      updateKelasSelectOptions();

      google.script.run
        .withSuccessHandler(function(stats) {
          if (stats && stats.success) {
            _pendaftaranTahunAktif = stats.tahunAjaranAktif || '20262';
            _pendaftaranNisInfo = stats.nisInfo || { nextNIS: '261066', lastNIS: '261065' };

            document.getElementById('badgeTahunAktifDisplay').textContent = _pendaftaranTahunAktif;
            document.getElementById('inputTahunAjaranPendaftaran').value = _pendaftaranTahunAktif;

            document.getElementById('dispLastNIS').textContent = _pendaftaranNisInfo.lastNIS || '-';
            document.getElementById('dispNextNIS').textContent = _pendaftaranNisInfo.nextNIS || '-';

            document.getElementById('statPendaftarBaru').textContent = (stats.totalPendaftarBaru || 0) + ' Menunggu';
            document.getElementById('statAktifTahunIni').textContent = (stats.totalAktifTahunIni || 0) + ' Diverifikasi';
            document.getElementById('statTotalSemua').textContent = (stats.totalPendaftar || stats.totalSemua || 0) + ' Santri';
          }

          // Ambil data list pendaftaran
          google.script.run
            .withSuccessHandler(function(resp) {
              hideLoading();
              if (resp && resp.success) {
                _pendaftaranData = resp.data || [];
                updateTahunFilterOptions();
                renderPendaftaranTable();
              } else {
                showToast('Gagal memuat daftar: ' + (resp ? resp.message : 'Unknown error'), 'error');
              }
            })
            .withFailureHandler(function(err) {
              hideLoading();
              showToast('Error load pendaftaran: ' + err.message, 'error');
            })
            .getPendaftaranList('semua');
        })
        .withFailureHandler(function(err) {
          hideLoading();
          showToast('Error load stats: ' + err.message, 'error');
        })
        .getPendaftaranStats();
    })
    .withFailureHandler(function(err) {
      hideLoading();
      showToast('Error load kelas: ' + err.message, 'error');
    })
    .getKelasList();
}

function updateKelasSelectOptions() {
  const selVerif = document.getElementById('verif_kelas');
  const selAdm = document.getElementById('adm_kelas');
  let opts = '<option value="">-- Pilih Kelas --</option>';
  let optsAdm = '<option value="-">-- Belum Ditentukan (-) --</option>';

  _pendaftaranKelasList.forEach(k => {
    const kName = k.Nama_Kelas || k['Nama Kelas'] || '';
    if (kName) {
      opts += `<option value="${kName}">Kelas ${kName}</option>`;
      optsAdm += `<option value="${kName}">Kelas ${kName}</option>`;
    }
  });

  if (selVerif) selVerif.innerHTML = opts;
  if (selAdm) selAdm.innerHTML = optsAdm;
}

function updateTahunFilterOptions() {
  const sel = document.getElementById('filterTahunPendaftar');
  if (!sel) return;

  const prevVal = sel.value || 'semua';
  const tahunSet = new Set();
  tahunSet.add(_pendaftaranTahunAktif);
  _pendaftaranData.forEach(s => {
    if (s.Tahun_Ajaran) tahunSet.add(String(s.Tahun_Ajaran).trim());
  });

  let html = '<option value="semua">Semua Tahun Ajaran</option>';
  Array.from(tahunSet).sort().reverse().forEach(t => {
    html += `<option value="${t}">Tahun Ajaran ${t}</option>`;
  });
  sel.innerHTML = html;
  sel.value = prevVal;
  if (!sel.value) sel.value = 'semua';
}

// ===== PAGINATION & FILTER LOGIC (MAKS 10 BARIS) =====
let _pendaftaranCurrentPage = 1;
const _pendaftaranPageSize = 10;
let _pendaftaranFilteredData = [];

function filterPendaftaranTable() {
  const search = (document.getElementById('searchPendaftar').value || '').toLowerCase().trim();
  const filterStatus = (document.getElementById('filterStatusPendaftar') ? document.getElementById('filterStatusPendaftar').value : 'semua');
  const filterTahun = (document.getElementById('filterTahunPendaftar') ? document.getElementById('filterTahunPendaftar').value : 'semua');

  _pendaftaranFilteredData = _pendaftaranData.filter(s => {
    // Filter status
    const st = String(s.Status || 'aktif').toLowerCase().trim();
    if (filterStatus === 'mendaftar') {
      if (!(st === 'mendaftar' || st === 'pending' || st.includes('daftar'))) return false;
    } else if (filterStatus === 'aktif') {
      if (st === 'mendaftar' || st === 'pending' || st.includes('daftar')) return false;
    }

    // Filter tahun
    if (filterTahun !== 'semua') {
      if (String(s.Tahun_Ajaran || '').trim() !== filterTahun) return false;
    }

    // Search query
    if (search) {
      const nama = String(s.Nama_Santri || s['Nama Santri'] || '').toLowerCase();
      const nis = String(s.NIS || '').toLowerCase();
      const sekolah = String(s.Nama_Sekolah || s['Nama Sekolah'] || '').toLowerCase();
      const ayah = String(s.Nama_Ayah || s['Nama Ayah'] || '').toLowerCase();
      const ibu = String(s.Nama_Ibu || s['Nama Ibu'] || '').toLowerCase();
      const alamat = String(s.Alamat || s.Alamat_Lengkap || '').toLowerCase();
      if (!nama.includes(search) && !nis.includes(search) && !sekolah.includes(search) && !ayah.includes(search) && !ibu.includes(search) && !alamat.includes(search)) {
        return false;
      }
    }

    return true;
  });

  _pendaftaranCurrentPage = 1;
  renderPendaftaranPage();
}

function renderPendaftaranTable() {
  filterPendaftaranTable();
}

function renderPendaftaranPage() {
  const totalItems = _pendaftaranFilteredData.length;
  const totalPages = Math.ceil(totalItems / _pendaftaranPageSize) || 1;

  if (_pendaftaranCurrentPage < 1) _pendaftaranCurrentPage = 1;
  if (_pendaftaranCurrentPage > totalPages) _pendaftaranCurrentPage = totalPages;

  const countBadge = document.getElementById('badgeCountFiltered');
  if (countBadge) countBadge.textContent = totalItems + ' Data';

  const startIndex = (_pendaftaranCurrentPage - 1) * _pendaftaranPageSize;
  const endIndex = Math.min(startIndex + _pendaftaranPageSize, totalItems);
  const pageRows = _pendaftaranFilteredData.slice(startIndex, endIndex);

  renderPendaftaranRows(pageRows, startIndex);
  renderPendaftaranPagination(totalItems, totalPages, startIndex, endIndex);
}

function renderPendaftaranPagination(totalItems, totalPages, startIndex, endIndex) {
  const infoEl = document.getElementById('pendaftaranPaginationInfo');
  const pagEl = document.getElementById('pendaftaranPagination');
  
  if (infoEl) {
    if (totalItems === 0) {
      infoEl.innerHTML = 'Menampilkan 0 data pendaftar';
    } else {
      infoEl.innerHTML = `Menampilkan <strong>${startIndex + 1} - ${endIndex}</strong> dari <strong>${totalItems}</strong> data pendaftar (Maks 10 baris per halaman)`;
    }
  }

  if (!pagEl) return;
  if (totalItems <= _pendaftaranPageSize) {
    pagEl.innerHTML = '';
    return;
  }

  let html = '';
  // Tombol Prev
  const prevDisabled = _pendaftaranCurrentPage === 1 ? 'disabled' : '';
  html += `<li class="page-item ${prevDisabled}">
    <button class="page-link py-1 px-2" onclick="gantiHalamanPendaftaran(${_pendaftaranCurrentPage - 1})" ${prevDisabled ? 'disabled' : ''}>
      <i class="fas fa-chevron-left me-1"></i> Prev
    </button>
  </li>`;

  // Nomor Halaman
  const maxButtons = 5;
  let startPage = Math.max(1, _pendaftaranCurrentPage - 2);
  let endPage = Math.min(totalPages, startPage + maxButtons - 1);
  if (endPage - startPage < maxButtons - 1) {
    startPage = Math.max(1, endPage - maxButtons + 1);
  }

  if (startPage > 1) {
    html += `<li class="page-item"><button class="page-link py-1 px-2" onclick="gantiHalamanPendaftaran(1)">1</button></li>`;
    if (startPage > 2) {
      html += `<li class="page-item disabled"><span class="page-link py-1 px-2">...</span></li>`;
    }
  }

  for (let p = startPage; p <= endPage; p++) {
    const active = p === _pendaftaranCurrentPage ? 'active' : '';
    html += `<li class="page-item ${active}"><button class="page-link py-1 px-2" onclick="gantiHalamanPendaftaran(${p})">${p}</button></li>`;
  }

  if (endPage < totalPages) {
    if (endPage < totalPages - 1) {
      html += `<li class="page-item disabled"><span class="page-link py-1 px-2">...</span></li>`;
    }
    html += `<li class="page-item"><button class="page-link py-1 px-2" onclick="gantiHalamanPendaftaran(${totalPages})">${totalPages}</button></li>`;
  }

  // Tombol Next
  const nextDisabled = _pendaftaranCurrentPage === totalPages ? 'disabled' : '';
  html += `<li class="page-item ${nextDisabled}">
    <button class="page-link py-1 px-2" onclick="gantiHalamanPendaftaran(${_pendaftaranCurrentPage + 1})" ${nextDisabled ? 'disabled' : ''}>
      Next <i class="fas fa-chevron-right ms-1"></i>
    </button>
  </li>`;

  pagEl.innerHTML = html;
}

function gantiHalamanPendaftaran(page) {
  _pendaftaranCurrentPage = page;
  renderPendaftaranPage();
}

function renderPendaftaranRows(data, startIndex) {
  const tbody = document.getElementById('pendaftaranTableBody');
  const countBadge = document.getElementById('badgeCountFiltered');
  if (countBadge) countBadge.textContent = data.length + ' Data';

  if (!data || data.length === 0) {
    tbody.innerHTML = `<tr><td colspan="13" class="text-center py-4 text-muted">Tidak ada data pendaftaran yang sesuai filter.</td></tr>`;
    return;
  }

  const q = String.fromCharCode(39);
  let html = '';

  data.forEach((s, idx) => {
    const nis = s.NIS || '-';
    const hasNis = nis && nis !== '-' && !String(nis).startsWith('S');
    const nama = s.Nama_Santri || s['Nama Santri'] || '-';
    const jkRaw = String(s.Jenis_Kelamin || s['L/P'] || '').toUpperCase();
    const isL = jkRaw.includes('LAKI') || jkRaw === 'L';
    const jkBadge = `<span class="badge ${isL ? 'bg-primary' : 'bg-danger'}">${isL ? 'L' : 'P'}</span>`;

    // Format TTL & Usia
    const tempat = s.Tempat_Lahir || s['Tempat Lahir'] || '';
    const tglRaw = s.Tanggal_Lahir || s['Tanggal Lahir'] || '';
    let ttl = '-';
    if (tempat && tglRaw) {
      try {
        const d = new Date(tglRaw);
        ttl = `${tempat}, ${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
      } catch(e) { ttl = tempat; }
    } else if (tempat) { ttl = tempat; }
    const usia = s.Usia ? ` (${s.Usia})` : '';

    // Tanggal Daftar
    const tglDaftarRaw = s.Tanggal_Daftar || s['Tanggal_Daftar'] || s.created_at || '';
    let tglDaftar = '-';
    if (tglDaftarRaw) {
      try {
        const d = new Date(tglDaftarRaw);
        if (!isNaN(d.getTime())) {
          tglDaftar = `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
        }
      } catch(e) {}
    }

    // Status
    const stRaw = String(s.Status || 'aktif').toLowerCase().trim();
    const isMendaftar = stRaw === 'mendaftar' || stRaw === 'pending' || stRaw.includes('daftar');
    const statusBadge = isMendaftar 
      ? `<span class="badge bg-warning text-dark fw-bold px-2 py-1 shadow-sm"><i class="fas fa-clock me-1"></i>Menunggu</span>` 
      : `<span class="badge bg-success fw-bold px-2 py-1 shadow-sm"><i class="fas fa-check-circle me-1"></i>Diverifikasi</span>`;

    // Ortu & WA
    const namaAyah = s.Nama_Ayah || s['Nama Ayah'] || '';
    const noWaAyah = s.No_WA_Ayah || s['No WA Ayah'] || '';
    const namaIbu = s.Nama_Ibu || s['Nama Ibu'] || '';
    const noWaIbu = s.No_WA_Ibu || s['No WA Ibu'] || '';
    
    let ortuHtml = '';
    if (namaAyah) {
      ortuHtml += `<div class="d-flex align-items-center justify-content-between gap-1 mb-1"><span class="small fw-semibold text-truncate" style="max-width:110px;" title="${namaAyah}">A: ${namaAyah}</span>`;
      if (noWaAyah) {
        const dW = String(noWaAyah).replace(/\D/g, '');
        const waNum = dW.startsWith('0') ? '62' + dW.slice(1) : dW;
        ortuHtml += `<a href="https://wa.me/${waNum}" target="_blank" class="btn btn-xs btn-outline-success py-0 px-1" style="font-size:0.68rem;"><i class="fab fa-whatsapp"></i></a>`;
      }
      ortuHtml += `</div>`;
    }
    if (namaIbu) {
      ortuHtml += `<div class="d-flex align-items-center justify-content-between gap-1"><span class="small fw-semibold text-truncate" style="max-width:110px;" title="${namaIbu}">I: ${namaIbu}</span>`;
      if (noWaIbu) {
        const dW = String(noWaIbu).replace(/\D/g, '');
        const waNum = dW.startsWith('0') ? '62' + dW.slice(1) : dW;
        ortuHtml += `<a href="https://wa.me/${waNum}" target="_blank" class="btn btn-xs btn-outline-success py-0 px-1" style="font-size:0.68rem;"><i class="fab fa-whatsapp"></i></a>`;
      }
      ortuHtml += `</div>`;
    }
    if (!ortuHtml) ortuHtml = '<span class="text-muted small">-</span>';

    // Aksi Buttons
    const btnVerif = isMendaftar
      ? `<button class="btn btn-sm btn-success text-white me-1 shadow-sm" onclick="bukaModalVerifikasi(${q}${s.NIS || ''}${q}, ${q}${nama}${q})" title="Verifikasi & Terima Santri"><i class="fas fa-check-circle me-1"></i>Terima</button>`
      : `<button class="btn btn-sm btn-outline-primary me-1" onclick="bukaModalVerifikasi(${q}${s.NIS || ''}${q}, ${q}${nama}${q})" title="Ubah NIS / Kelas"><i class="fas fa-edit me-1"></i>Edit</button>`;

    const btnDetail = `<button class="btn btn-sm btn-info text-white me-1" onclick="showSantriDetail(${q}${s.NIS}${q})" title="Lihat Biodata Lengkap"><i class="fas fa-eye"></i></button>`;
    const btnHapus = `<button class="btn btn-sm btn-outline-danger" onclick="hapusPendaftar(${q}${s.NIS}${q}, ${q}${nama}${q})" title="Hapus"><i class="fas fa-trash"></i></button>`;

    html += `
      <tr>
        <td class="text-center text-muted small">${(startIndex || 0) + idx + 1}</td>
        <td class="small text-nowrap">${tglDaftar}</td>
        <td>
          ${hasNis ? `<span class="badge bg-primary font-monospace fs-6 px-2 py-1 shadow-sm">${nis}</span>` : `<span class="badge bg-secondary font-monospace" style="font-size:0.75rem;">(Belum NIS)</span>`}
        </td>
        <td><strong>${nama}</strong></td>
        <td class="text-center">${jkBadge}</td>
        <td class="small text-nowrap">${ttl}${usia}</td>
        <td class="small text-truncate" style="max-width: 130px;" title="${s.Nama_Sekolah || '-'}">${s.Nama_Sekolah || '-'}</td>
        <td style="min-width: 140px;">${ortuHtml}</td>
        <td class="small text-truncate" style="max-width: 140px;" title="${s.Alamat || s.Alamat_Lengkap || '-'}">${s.Alamat || s.Alamat_Lengkap || '-'}</td>
        <td class="text-center"><span class="badge bg-light text-dark font-monospace border">${s.Tahun_Ajaran || '-'}</span></td>
        <td class="text-center"><span class="badge bg-info text-dark">${s.Kelas || '-'}</span></td>
        <td class="text-center">${statusBadge}</td>
        <td class="text-center text-nowrap">
          ${btnVerif}
          ${btnDetail}
          ${btnHapus}
        </td>
      </tr>
    `;
  });

  tbody.innerHTML = html;
}

function simpanTahunAjaranPendaftaran() {
  const val = document.getElementById('inputTahunAjaranPendaftaran').value.trim();
  if (!val) {
    showToast('Tahun Ajaran tidak boleh kosong', 'warning');
    return;
  }

  showLoading('Menyimpan Tahun Ajaran Pendaftaran...');
  google.script.run
    .withSuccessHandler(function(res) {
      hideLoading();
      if (res && res.success) {
        showToast(res.message, 'success');
        _pendaftaranTahunAktif = val;
        document.getElementById('badgeTahunAktifDisplay').textContent = val;
        updateTahunFilterOptions();
      } else {
        showToast('Gagal: ' + (res ? res.message : 'Unknown error'), 'error');
      }
    })
    .withFailureHandler(function(err) {
      hideLoading();
      showToast('Error: ' + err.message, 'error');
    })
    .setTahunAjaranPendaftaran(val);
}

// ===== MODAL VERIFIKASI & TERIMA SANTRI =====

function bukaModalVerifikasi(nis, nama) {
  const s = _pendaftaranData.find(x => (nis && String(x.NIS) === String(nis)) || (nama && String(x.Nama_Santri).toLowerCase() === String(nama).toLowerCase()));
  if (!s) return;

  document.getElementById('verif_nis_lama').value = s.NIS || '';
  document.getElementById('verif_nama').value = s.Nama_Santri || '';
  document.getElementById('verif_info_nama').textContent = s.Nama_Santri || '-';
  document.getElementById('verif_info_detail').textContent = `${s.Tempat_Lahir || '-'}, ${s.Tanggal_Lahir || '-'} | Asal: ${s.Nama_Sekolah || '-'}`;

  // Cek apakah santri sudah punya NIS valid
  const existingNis = s.NIS && !String(s.NIS).startsWith('S') && String(s.NIS).length >= 5 ? String(s.NIS).trim() : '';
  if (existingNis) {
    document.getElementById('verif_nis_baru').value = existingNis;
  } else {
    // Otomatis isi dengan NIS terbesar berikutnya
    isiNisOtomatisDiModalVerif();
  }

  // Set Kelas
  const selKelas = document.getElementById('verif_kelas');
  if (s.Kelas && s.Kelas !== '-') {
    selKelas.value = s.Kelas;
  } else {
    selKelas.selectedIndex = selKelas.options.length > 1 ? 1 : 0;
  }

  document.getElementById('verif_status').value = 'Aktif';
  document.getElementById('verif_buat_user').checked = true;

  const modal = new bootstrap.Modal(document.getElementById('modalVerifikasiSantri'));
  modal.show();
}

function isiNisOtomatisDiModalVerif() {
  showLoading('Mengambil urutan NIS terbesar...');
  google.script.run
    .withSuccessHandler(function(info) {
      hideLoading();
      if (info && info.nextNIS) {
        document.getElementById('verif_nis_baru').value = info.nextNIS;
        showToast(`NIS otomatis diset: ${info.nextNIS}`, 'info');
      }
    })
    .withFailureHandler(function(err) {
      hideLoading();
      document.getElementById('verif_nis_baru').value = _pendaftaranNisInfo.nextNIS || '261066';
    })
    .getNextNIS();
}

function submitVerifikasiSantri() {
  const nisLama = document.getElementById('verif_nis_lama').value;
  const nama = document.getElementById('verif_nama').value;
  const nisBaru = document.getElementById('verif_nis_baru').value.trim();
  const kelas = document.getElementById('verif_kelas').value;
  const status = document.getElementById('verif_status').value;
  const buatUser = document.getElementById('verif_buat_user').checked;

  if (!nisBaru) {
    showToast('NIS wajib diisi!', 'warning');
    return;
  }
  if (!kelas) {
    showToast('Silakan pilih Kelas untuk santri!', 'warning');
    return;
  }

  const payload = {
    nisLama: nisLama,
    nama: nama,
    Nama_Santri: nama,
    nisBaru: nisBaru,
    NIS: nisBaru,
    Kelas: kelas,
    Status: status,
    buatUser: buatUser,
    Tahun_Ajaran: _pendaftaranTahunAktif
  };

  showLoading('Menyimpan verifikasi santri...');
  google.script.run
    .withSuccessHandler(function(res) {
      hideLoading();
      if (res && res.success) {
        showToast(res.message, 'success');
        const modalEl = document.getElementById('modalVerifikasiSantri');
        const modal = bootstrap.Modal.getInstance(modalEl);
        if (modal) modal.hide();
        refreshPendaftaranData();
      } else {
        showToast('Gagal: ' + (res ? res.message : 'Unknown error'), 'error');
      }
    })
    .withFailureHandler(function(err) {
      hideLoading();
      showToast('Error: ' + err.message, 'error');
    })
    .verifikasiPendaftaranSantri(payload);
}

  document.getElementById('formTambahPendaftarAdmin').reset();
  isiNisOtomatisAdminForm();

  const modal = new bootstrap.Modal(document.getElementById('modalTambahPendaftarAdmin'));
  modal.show();
}

function isiNisOtomatisAdminForm() {
  showLoading('Mengambil urutan NIS terbesar...');
  google.script.run
    .withSuccessHandler(function(info) {
      hideLoading();
      if (info && info.nextNIS) {
        document.getElementById('adm_nis').value = info.nextNIS;
      }
    })
    .withFailureHandler(function(err) {
      hideLoading();
      document.getElementById('adm_nis').value = _pendaftaranNisInfo.nextNIS || '261066';
    })
    .getNextNIS();
}

function hitungUsiaAdmin() {
  const tgl = document.getElementById('adm_tgl_lahir').value;
  if (!tgl) return;
  try {
    const bDate = new Date(tgl);
    if (!isNaN(bDate.getTime())) {
      const diff = Date.now() - bDate.getTime();
      const age = Math.abs(new Date(diff).getUTCFullYear() - 1970);
      if (age >= 0 && age < 100) {
        document.getElementById('adm_usia').value = age + ' Tahun';
      }
    }
  } catch(e) {}
}

function submitTambahPendaftarAdmin() {
  const payload = {
    Nama_Santri: document.getElementById('adm_nama_santri').value.trim(),
    Jenis_Kelamin: document.getElementById('adm_jk').value,
    Tempat_Lahir: document.getElementById('adm_tempat_lahir').value.trim(),
    Tanggal_Lahir: document.getElementById('adm_tgl_lahir').value,
    Usia: document.getElementById('adm_usia').value.trim(),
    Nama_Sekolah: document.getElementById('adm_nama_sekolah').value.trim(),
    NIS: document.getElementById('adm_nis').value.trim(),
    Nama_Ayah: document.getElementById('adm_nama_ayah').value.trim(),
    No_WA_Ayah: document.getElementById('adm_wa_ayah').value.trim(),
    Nama_Ibu: document.getElementById('adm_nama_ibu').value.trim(),
    No_WA_Ibu: document.getElementById('adm_wa_ibu').value.trim(),
    Alamat: document.getElementById('adm_alamat').value.trim(),
    Kelas: document.getElementById('adm_kelas').value,
    Status: document.getElementById('adm_status').value,
    Tahun_Ajaran: _pendaftaranTahunAktif,
    buatUser: document.getElementById('adm_status').value === 'Aktif'
  };

  showLoading('Menyimpan pendaftar baru...');
  google.script.run
    .withSuccessHandler(function(res) {
      hideLoading();
      if (res && res.success) {
        showToast(res.message, 'success');
        const modalEl = document.getElementById('modalTambahPendaftarAdmin');
        const modal = bootstrap.Modal.getInstance(modalEl);
        if (modal) modal.hide();
        refreshPendaftaranData();
      } else {
        showToast('Gagal: ' + (res ? res.message : 'Unknown error'), 'error');
      }
    })
    .withFailureHandler(function(err) {
      hideLoading();
      showToast('Error: ' + err.message, 'error');
    })
    .daftarSantriBaru(payload);
}

function hapusPendaftar(nis, nama) {
  if (confirm(`Yakin ingin menghapus calon santri "${nama}" (${nis || 'Belum NIS'})?`)) {
    showLoading('Menghapus data...');
    google.script.run
      .withSuccessHandler(function(res) {
        hideLoading();
        showToast('Data santri berhasil dihapus', 'success');
        refreshPendaftaranData();
      })
      .withFailureHandler(function(err) {
        hideLoading();
        showToast('Error: ' + err.message, 'error');
      })
      .deleteSantri(nis);
  }
}

function exportPendaftaranExcel() {
  if (!_pendaftaranData || _pendaftaranData.length === 0) {
    showToast('Tidak ada data untuk diexport', 'warning');
    return;
  }
  showLoading('Menyiapkan file Excel...');
  google.script.run
    .withSuccessHandler(function(res) {
      hideLoading();
      if (res && res.success) {
        window.open(res.downloadUrl, '_blank');
        showToast('Excel berhasil digenerate', 'success');
      } else {
        showToast('Gagal export: ' + (res ? res.message : 'Unknown error'), 'error');
      }
    })
    .withFailureHandler(function(err) {
      hideLoading();
      showToast('Error export: ' + err.message, 'error');
    })
    .exportToExcel(`Pendaftaran_Santri_TPQ_Al_Mabrur_${_pendaftaranTahunAktif}`, _pendaftaranData);
}
